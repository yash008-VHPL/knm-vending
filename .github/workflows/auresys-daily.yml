name: Auresys Transaction Pull (05:00 and 17:00 SGT)

# GitHub cron is always UTC.
#
#   21:00 UTC  ->  05:00 SGT next day   THE RECONCILIATION RUN
#                  Window ends at D-1. Runs after the machines settle (~02:30
#                  SGT) so the previous day is complete. This is the run the
#                  D-1 telemetry comparison depends on, and it must stay
#                  D-1-only: vw_NETS_Daily_Count excludes today for a reason.
#
#   09:00 UTC  ->  17:00 SGT same day   THE FRESHNESS RUN
#                  Adds --include-today so the day so far is loaded, partial.
#                  This exists for the dashboard vend counter: a flag card
#                  tapped in the morning shows up the same evening instead of
#                  the next day. The 05:00 run then reloads that day complete
#                  and replaces it (staged > before -> LOADED).
#
# A partial today is safe for "dispenses since last flag" - it undercounts
# slightly until the next pull, which beats being a day stale. It is NOT safe
# for the reconciliation, which is why only one of the two runs carries the flag.
on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Rolling window in days (default 10)'
        required: false
      from:
        description: 'Window start YYYY-MM-DD (overrides days)'
        required: false
      to:
        description: 'Window end YYYY-MM-DD'
        required: false
      dry_run:
        description: 'true = report only, write nothing'
        required: false
        default: 'false'
      include_today:
        description: "true = also load today's partial data (the 17:00 run does this)"
        required: false
        default: 'false'

concurrency:
  # A second run must never overlap a DELETE-then-INSERT already in flight.
  group: auresys-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # Pinned to a commit SHA, not a mutable tag: a repointed tag would run
        # arbitrary code in a job that holds the database credentials.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b   # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests pymssql

      - name: Run the pull
        env:
          AURESYS_USER:      ${{ secrets.AURESYS_USER }}
          AURESYS_PASSWORD:  ${{ secrets.AURESYS_PASSWORD }}
          NETS_CARD_PEPPER:  ${{ secrets.NETS_CARD_PEPPER }}
          DB_SERVER:         machineserver.database.windows.net
          DB_NAME:           "Machine DispensedDrink"
          NETS_DB_USER:      ${{ secrets.NETS_DB_USER || secrets.DB_USER }}
          NETS_DB_PASSWORD:  ${{ secrets.NETS_DB_PASSWORD || secrets.DB_PASSWORD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          HEARTBEAT_URL:     ${{ secrets.HEARTBEAT_URL }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '10' }}"
          if [ -n "${{ github.event.inputs.from }}" ]; then
            ARGS="--from ${{ github.event.inputs.from }}"
            [ -n "${{ github.event.inputs.to }}" ] && ARGS="$ARGS --to ${{ github.event.inputs.to }}"
          fi
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          # github.event.schedule is the literal cron string that fired this run
          # - the only way to tell the two schedules apart. It is empty on a
          # manual dispatch, which is why the input is checked as well.
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ] \
             || [ "${{ github.event.inputs.include_today }}" = "true" ]; then
            ARGS="$ARGS --include-today"
          fi
          echo "auresys_pull.py $ARGS"
          python auresys_pull.py $ARGS
