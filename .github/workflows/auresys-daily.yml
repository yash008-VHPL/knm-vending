name: Auresys Transaction Pull (06:00 and 18:00 SGT)

# GitHub cron is always UTC.
#
# Times moved from 05:00/17:00 to 06:00/18:00 on 2026-08-30 at the field team's
# request. The 05:00 rationale still holds at 06:00: the machines settle around
# 02:30 SGT, so D-1 is complete either way.
#
# These schedule entries are now the BACKSTOP, not the primary trigger. GitHub
# `schedule:` is best-effort - observed 0.4-2.2h late here, and dropped outright
# on 2026-08-28 and 2026-08-30, which is how a 13h gap appeared between pulls.
# The guaranteed trigger dispatches this same workflow on time; these crons stay
# so that a failure of that trigger still yields a pull. A duplicate run is
# nearly free: the NO_CHANGE short-circuit writes nothing, and the concurrency
# group below serialises them.
#
#   22:00 UTC  ->  06:00 SGT next day   NIGHT SHIFT + RECONCILIATION
#                  Runs after the machines settle (~02:30 SGT), so D-1 is
#                  complete: this is the pass the D-1 telemetry comparison
#                  depends on. It also carries --include-today, where "today"
#                  is only 00:00-06:00 - which is exactly where a NIGHT SHIFT's
#                  work lands. Without that, a top-up finished at 01:00 stayed
#                  invisible until 18:00.
#
#   10:00 UTC  ->  18:00 SGT same day    DAY SHIFT
#                  --include-today loads the day so far, so a flag card tapped
#                  in the morning shows up the same evening.
#
# Both runs carry --include-today; the flag only decides whether the CURRENT
# day is in the window. D-1 - the newest day that is certainly complete - is
# force-rewritten on every run (see last_full in auresys_pull.load), so a day
# first written partially is always replaced by a complete one and the
# reconciliation still only ever reads whole days. vw_NETS_Daily_Count excludes
# today regardless, so partial rows never reach it on the day itself.
on:
  schedule:
    # :30, not :00 - the Logic App fires on the hour. Same instant would
    # mean one of the two shows as concurrency-cancelled every time, and a
    # cancelled run in the history reads as a failure to whoever looks.
    - cron: '30 22 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Rolling window in days (default 10)'
        required: false
      from:
        description: 'Window start YYYY-MM-DD (overrides days)'
        required: false
      to:
        description: 'Window end YYYY-MM-DD'
        required: false
      dry_run:
        description: 'true = report only, write nothing'
        required: false
        default: 'false'
      include_today:
        description: "true = also load today's partial data (both scheduled runs do)"
        required: false
        default: 'false'

concurrency:
  # A second run must never overlap a DELETE-then-INSERT already in flight.
  group: auresys-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # Pinned to a commit SHA, not a mutable tag: a repointed tag would run
        # arbitrary code in a job that holds the database credentials.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b   # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests pymssql

      - name: Run the pull
        env:
          AURESYS_USER:      ${{ secrets.AURESYS_USER }}
          AURESYS_PASSWORD:  ${{ secrets.AURESYS_PASSWORD }}
          NETS_CARD_PEPPER:  ${{ secrets.NETS_CARD_PEPPER }}
          DB_SERVER:         machineserver.database.windows.net
          DB_NAME:           "Machine DispensedDrink"
          NETS_DB_USER:      ${{ secrets.NETS_DB_USER || secrets.DB_USER }}
          NETS_DB_PASSWORD:  ${{ secrets.NETS_DB_PASSWORD || secrets.DB_PASSWORD }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          HEARTBEAT_URL:     ${{ secrets.HEARTBEAT_URL }}
          IN_DAYS:           ${{ inputs.days }}
          IN_FROM:           ${{ inputs.from }}
          IN_TO:             ${{ inputs.to }}
          IN_DRY_RUN:        ${{ inputs.dry_run }}
          IN_INCLUDE_TODAY:  ${{ inputs.include_today }}
          EVT_SCHEDULE:      ${{ github.event.schedule }}
        run: |
          # Inputs arrive as env vars, never interpolated into the script text.
          # A ${{ }} expression is substituted before bash parses the line, so a
          # value containing a quote would run arbitrary commands in a job that
          # holds AURESYS_PASSWORD, NETS_CARD_PEPPER and the DB credentials.
          ARGS="--days ${IN_DAYS:-10}"
          if [ -n "$IN_FROM" ]; then
            ARGS="--from $IN_FROM"
            [ -n "$IN_TO" ] && ARGS="$ARGS --to $IN_TO"
          fi
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # Every SCHEDULED run loads today; github.event.schedule is non-empty
          # only on a scheduled run and empty on a manual dispatch. A manual run
          # stays D-1-only unless asked, so investigating a historical window
          # never drags today's partial rows in with it.
          if [ -n "$EVT_SCHEDULE" ] || [ "$IN_INCLUDE_TODAY" = "true" ]; then
            ARGS="$ARGS --include-today"
          fi
          echo "auresys_pull.py $ARGS"
          python auresys_pull.py $ARGS
