<!--
  Machine History tab — admin / field_manager.
  Pick a machine → see complaints, work orders, delivery orders, and all
  activity in one chronological timeline. Backed by /api/wo/manager/equipment-log.
  Namespace: .mh-*
-->

<style>
    .mh-section { max-width: 1100px; margin: 24px auto; padding: 0 18px; }

    .mh-toolbar {
        display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center;
    }
    .mh-toolbar input[type="search"] {
        padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 7px;
        font-size: 0.92rem; flex: 1; min-width: 220px;
    }
    .mh-machine-list {
        background: white; border: 1px solid #e5e7eb; border-radius: 9px;
        max-height: 320px; overflow-y: auto;
    }
    .mh-machine-row {
        padding: 9px 14px; border-bottom: 1px solid #f3f4f6; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 0.88rem;
    }
    .mh-machine-row:last-child { border-bottom: none; }
    .mh-machine-row:hover { background: #f8faff; }
    .mh-machine-row .code { font-family: ui-monospace, monospace; color: #6b7280; font-size: 0.78rem; }

    .mh-detail {
        background: white; border: 1px solid #e5e7eb; border-radius: 11px;
        padding: 16px 18px; margin-top: 14px; position: relative;
    }
    .mh-detail h3 { margin: 0 0 8px 0; font-size: 1.05rem; color: #111827; padding-right: 30px; }
    .mh-detail .sub { font-size: 0.84rem; color: #6b7280; font-family: ui-monospace, monospace; margin-bottom: 12px; }
    .mh-detail .close-x {
        position: absolute; top: 10px; right: 12px;
        background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;
        width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
        font-size: 1.05rem; font-weight: 700; line-height: 1;
    }
    .mh-detail .close-x:hover { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }

    .mh-stats {
        display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .mh-stat {
        background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px;
        padding: 10px 14px; flex: 1; min-width: 140px;
    }
    .mh-stat .label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
        color: #6b7280; letter-spacing: 0.05em; }
    .mh-stat .value { font-size: 1.05rem; font-weight: 700; color: #111827; margin-top: 3px; }

    .mh-events { margin-top: 8px; }
    .mh-evt {
        padding: 10px 12px; border-left: 3px solid #cbd5e1; margin-bottom: 8px;
        background: #f9fafb; border-radius: 5px;
    }
    .mh-evt.complaint     { border-left-color: #b45309; }
    .mh-evt.joborder      { border-left-color: #1a56db; }
    .mh-evt.deliveryorder { border-left-color: #15803d; }
    .mh-evt .head { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; margin-bottom: 3px; }
    .mh-evt .type {
        font-size: 0.66rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.03em; padding: 2px 7px; border-radius: 4px;
    }
    .mh-evt.complaint     .type { background: #fef3c7; color: #b45309; }
    .mh-evt.joborder      .type { background: #dbeafe; color: #1e40af; }
    .mh-evt.deliveryorder .type { background: #dcfce7; color: #15803d; }
    .mh-evt .display-id { font-family: ui-monospace, monospace; color: #6b7280; font-size: 0.76rem; }
    .mh-evt .action { font-weight: 700; color: #111827; font-size: 0.84rem; }
    .mh-evt .at { color: #6b7280; font-size: 0.74rem; margin-left: auto; }
    .mh-evt .summary { font-size: 0.86rem; color: #374151; margin-top: 4px; line-height: 1.4; }
    .mh-evt .by { font-size: 0.74rem; color: #6b7280; margin-top: 3px; }

    /* Location history timeline */
    .mh-loc-wrap { margin: 4px 0 16px 0; }
    .mh-loc-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
        color: #6b7280; letter-spacing: 0.05em; margin-bottom: 8px; }
    .mh-loc {
        display: flex; gap: 10px; align-items: baseline;
        padding: 8px 12px; border-left: 3px solid #6366f1; margin-bottom: 6px;
        background: #f5f3ff; border-radius: 5px;
    }
    .mh-loc.current { border-left-color: #15803d; background: #f0fdf4; }
    .mh-loc.decom   { border-left-color: #9ca3af; background: #f9fafb; }
    .mh-loc .name { font-weight: 700; color: #111827; font-size: 0.9rem; }
    .mh-loc .range { color: #6b7280; font-size: 0.78rem; margin-left: auto; font-family: ui-monospace, monospace; }
    .mh-loc .badge { font-size: 0.64rem; font-weight: 700; text-transform: uppercase;
        padding: 2px 7px; border-radius: 4px; background: #dcfce7; color: #15803d; }

    .mh-empty { text-align: center; color: #9ca3af; padding: 30px 10px; font-size: 0.88rem; }
    .mh-msg { padding: 10px 14px; border-radius: 6px; font-size: 0.84rem; margin-bottom: 12px; }
    .mh-msg.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .mh-msg.loading { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
</style>

<div class="mh-section">
    <div class="mh-toolbar">
        <input type="search" id="mhSearch" placeholder="Search machine name or code…" oninput="window.__mhSearch()">
    </div>
    <div id="mhMsg"></div>
    <div id="mhMachineList" class="mh-machine-list"></div>
    <div id="mhDetail" style="display:none"></div>
</div>

<script>
(function(){
    'use strict';

    var state = { machines: [], loaded: false, currentCode: null };

    function api(url, opts){
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers['Accept'] = 'application/json';
        return fetch(url, opts).then(function(r){
            return r.json().then(function(d){
                if(!r.ok){
                    var err = new Error(d.error || ('HTTP ' + r.status));
                    err.kind = (r.status === 404) ? 'notfound' : 'http';
                    err.status = r.status;
                    throw err;
                }
                return d;
            }, function(){
                // JSON parse failure (e.g. HTML error page)
                var err = new Error('Server returned non-JSON response (status ' + r.status + ').');
                err.kind = 'http';
                err.status = r.status;
                throw err;
            });
        }, function(networkErr){
            // fetch() rejected — true network failure / CORS / offline
            var err = new Error('Network error — could not reach the server. Check connectivity and retry.');
            err.kind = 'network';
            err.original = String(networkErr && networkErr.message || networkErr);
            throw err;
        });
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    }); }
    function fmtDT(s){ if(!s) return '—'; try { return new Date(s).toLocaleString(); } catch(e){ return s; } }
    function showMsg(html, cls){
        document.getElementById('mhMsg').innerHTML = html ? '<div class="mh-msg '+ (cls||'') +'">'+ html +'</div>' : '';
    }
    function showError(err){
        var label = 'Error';
        if(err && err.kind === 'network')  label = '⚠ Network error';
        else if(err && err.kind === 'notfound') label = 'Not found';
        else if(err && err.status >= 500) label = '⚠ Server error';
        showMsg('<strong>' + label + ':</strong> ' + esc(err && err.message ? err.message : String(err)), 'error');
    }

    window.__mhInit = function(){
        if(state.loaded) return;
        state.loaded = true;
        loadMachines();
    };

    function loadMachines(){
        showMsg('Loading machines…', 'loading');
        api('/api/wo/manager/machines').then(function(arr){
            state.machines = arr || [];
            if(!state.machines.length){
                showMsg('No machines registered in MachineLookup yet.', 'error');
                document.getElementById('mhMachineList').innerHTML = '<div class="mh-empty">No machines.</div>';
                return;
            }
            renderMachines();
            showMsg('', '');
        }).catch(showError);
    }

    function renderMachines(){
        var q = (document.getElementById('mhSearch').value || '').toLowerCase();
        var rows = state.machines.filter(function(m){
            if(!q) return true;
            return (m.name || '').toLowerCase().indexOf(q) >= 0
                || (m.code || '').toLowerCase().indexOf(q) >= 0;
        });
        if(!rows.length){
            document.getElementById('mhMachineList').innerHTML =
                '<div class="mh-empty">No machines match.</div>';
            return;
        }
        document.getElementById('mhMachineList').innerHTML = rows.map(function(m){
            return ''
              + '<div class="mh-machine-row" onclick="window.__mhPick(\'' + esc(m.code) + '\')">'
              +   '<div>' + esc(m.name) + '</div>'
              +   '<div class="code">' + esc(m.code) + '</div>'
              + '</div>';
        }).join('');
    }

    window.__mhSearch = function(){ renderMachines(); };

    window.__mhPick = function(code){
        state.currentCode = code;
        showMsg('Loading history…', 'loading');
        api('/api/wo/manager/equipment-log?machine_code=' + encodeURIComponent(code)).then(function(d){
            // Hide the search/list while exploring one machine; show again on close.
            document.querySelector('.mh-toolbar').style.display      = 'none';
            document.getElementById('mhMachineList').style.display    = 'none';
            renderDetail(d);
            showMsg('', '');
        }).catch(function(e){
            document.getElementById('mhDetail').style.display = 'none';
            showError(e);
        });
    };

    window.__mhClose = function(){
        document.getElementById('mhDetail').style.display          = 'none';
        document.querySelector('.mh-toolbar').style.display        = 'flex';
        document.getElementById('mhMachineList').style.display     = 'block';
        state.currentCode = null;
    };

    function renderDetail(d){
        var m = d.machine || {};
        var c = d.counts  || {};
        var html = ''
          + '<div class="mh-detail">'
          +   '<button class="close-x" title="Close" onclick="window.__mhClose()">&times;</button>'
          +   '<h3>' + esc((m.names || []).join(' / ') || 'Unknown') + '</h3>'
          +   '<div class="sub">' + esc(m.code || '') + '</div>'
          +   '<div class="mh-stats">'
          +     '<div class="mh-stat"><div class="label">Complaints</div><div class="value">' + (c.complaints || 0) + '</div></div>'
          +     '<div class="mh-stat"><div class="label">Work orders</div><div class="value">' + (c.job_orders || 0) + '</div></div>'
          +     '<div class="mh-stat"><div class="label">Deliveries</div><div class="value">' + (c.delivery_orders || 0) + '</div></div>'
          +     '<div class="mh-stat"><div class="label">Last topup</div><div class="value" style="font-size:0.88rem">' + esc(fmtDT(m.last_topup)) + '</div></div>'
          +     '<div class="mh-stat"><div class="label">Vends since</div><div class="value">' + (m.vends_since_last_topup != null ? m.vends_since_last_topup : '—') + '</div></div>'
          +   '</div>'
          +   renderLocationHistory(d.location_history || [])
          +   renderRecordMove(m.code)
          +   '<div class="mh-events">' + renderEvents(d.events || []) + '</div>'
          + '</div>';
        document.getElementById('mhDetail').style.display = 'block';
        document.getElementById('mhDetail').innerHTML = html;
    }

    function renderRecordMove(code){
        return ''
          + '<div class="mh-loc-wrap" style="margin-top:12px">'
          +   '<div class="mh-loc-title">Record a past move</div>'
          +   '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
          +     '<div><div style="font-size:.7rem;color:#6b7280;margin-bottom:2px">Previous location</div>'
          +       '<input id="mhMovePrev" type="text" placeholder="e.g. Kranji Camp Blk 808" '
          +         'style="padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;min-width:230px"></div>'
          +     '<div><div style="font-size:.7rem;color:#6b7280;margin-bottom:2px">Moved on (SGT)</div>'
          +       '<input id="mhMoveDate" type="date" '
          +         'style="padding:6px 8px;border:1px solid #d1d5db;border-radius:6px"></div>'
          +     '<button id="mhAddMoveBtn" onclick="window.__mhAddMove(\'' + esc(code) + '\')" '
          +       'style="padding:7px 14px;background:#1a56db;color:#fff;border:none;border-radius:6px;cursor:pointer">Add move</button>'
          +   '</div>'
          +   '<div style="font-size:.72rem;color:#6b7280;margin-top:5px">'
          +     'Splits history: vends before this date read the previous location; from this date they read the current one.</div>'
          + '</div>';
    }

    window.__mhAddMove = function(code){
        var prev = (document.getElementById('mhMovePrev').value || '').trim();
        var date = (document.getElementById('mhMoveDate').value || '').trim();
        if(!prev || !date){ showMsg('Enter both a previous location and a move date.', 'error'); return; }
        var btn = document.getElementById('mhAddMoveBtn');
        if(btn){ if(btn.disabled) return; btn.disabled = true; btn.style.opacity = 0.6; }  // no double-submit
        api('/api/wo/manager/machine/' + encodeURIComponent(code) + '/record-move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ previous_location: prev, moved_on: date })
        }).then(function(){
            showMsg('Move recorded — history updated.', 'loading');
            window.__mhPick(code);   // reload detail → timeline refreshes
        }).catch(function(e){
            if(btn){ btn.disabled = false; btn.style.opacity = 1; }
            showError(e);
        });
    };

    function renderLocationHistory(hist){
        if(!hist.length) return '';
        var rows = hist.map(function(h){
            var decom = (h.location === '(decommissioned)');
            var cls = h.current ? 'current' : (decom ? 'decom' : '');
            var range = esc(h.from) + ' → ' + (h.to ? esc(h.to) : 'present');
            return ''
              + '<div class="mh-loc ' + cls + '">'
              +   '<span class="name">' + esc(h.location) + '</span>'
              +   (h.current ? '<span class="badge">current</span>' : '')
              +   '<span class="range">' + range + '</span>'
              + '</div>';
        }).join('');
        return '<div class="mh-loc-wrap"><div class="mh-loc-title">Where this machine has been</div>' + rows + '</div>';
    }

    function renderEvents(events){
        if(!events.length){
            return '<div class="mh-empty">No history yet for this machine.</div>';
        }
        return events.map(function(e){
            var cls = e.type || '';
            var disp = e.display_id ? ' <span class="display-id">' + esc(e.display_id) + '</span>' : '';
            return ''
              + '<div class="mh-evt ' + cls + '">'
              +   '<div class="head">'
              +     '<span class="type">' + esc(e.type || '') + '</span>'
              +     '<span class="action">' + esc(e.action || '') + '</span>'
              +     disp
              +     '<span class="at">' + esc(fmtDT(e.at)) + '</span>'
              +   '</div>'
              +   (e.summary ? '<div class="summary">' + esc(e.summary) + '</div>' : '')
              +   (e.by ? '<div class="by">by ' + esc(e.by) + (e.status ? ' · status: ' + esc(e.status) : '') + '</div>'
                       : (e.status ? '<div class="by">status: ' + esc(e.status) + '</div>' : ''))
              + '</div>';
        }).join('');
    }

})();
</script>
