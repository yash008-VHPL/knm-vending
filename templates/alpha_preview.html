<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNM Ops — Streamlined (beta)</title>
<style>
  :root{
    --blue:#1a56db;--blue-d:#163fa8;--ink:#1f2933;--mut:#6b7280;--line:#e5e7eb;
    --bg:#f0f4f8;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#b91c1c;
    --green-bg:#dcfce7;--amber-bg:#fef3c7;--red-bg:#fee2e2;--chip:#eef2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:var(--blue);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header .brand{font-weight:800}
  header .brand small{display:block;font-weight:500;opacity:.8;font-size:.7rem}
  .rolepick{display:flex;align-items:center;gap:8px;font-size:.78rem;flex-wrap:wrap}
  .rolepick select{border-radius:7px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;padding:5px 9px;font-weight:600}
  .rolepick select option{color:#111}
  .banner{padding:7px 18px;font-size:.78rem;font-weight:600;display:flex;gap:8px;align-items:center}
  .banner.live{background:var(--green-bg);color:#14532d}
  .banner.demo{background:var(--amber-bg);color:#7c2d12}
  .banner b{font-weight:800}
  nav.tabs{display:flex;gap:4px;background:#fafbff;border-bottom:1px solid var(--line);padding:6px 12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-size:.9rem;font-weight:600;color:var(--mut);cursor:pointer;border-radius:7px 7px 0 0}
  nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
  .screen-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .screen-h h2{font-size:1.2rem;font-weight:800}
  .screen-h .crumb{font-size:.74rem;color:var(--mut)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#eef2ff;color:var(--blue)}
  .btn.sm{padding:5px 10px;font-size:.74rem}
  .btn.danger{background:#fee2e2;color:#b91c1c}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .subnav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .subnav button{font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:20px;background:#f1f5f9;color:#475569;border:none;cursor:pointer}
  .subnav button.on{background:var(--blue);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fafbff}
  .kpi b{font-size:1.5rem;display:block;line-height:1.1}
  .kpi small{color:var(--mut)}
  .rows{display:grid;gap:8px}
  .row{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .row .grow{flex:1;min-width:0}
  .row .grow b{display:block}
  .row .meta{font-size:.76rem;color:var(--mut)}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
  .tag{font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .tag.svc{background:#fee2e2;color:#b91c1c}.tag.del{background:#dbeafe;color:#1d4ed8}
  .tag.mov{background:#ede9fe;color:#6d28d9}.tag.done{background:#dcfce7;color:#15803d}
  .tag.new{background:#fef3c7;color:#92400e}.tag.assigned{background:#e0e7ff;color:#3730a3}
  label{display:block;font-size:.74rem;font-weight:700;color:var(--mut);margin:0 0 4px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;font-family:inherit;background:#fff}
  textarea{min-height:64px;resize:vertical}
  .field{margin-bottom:11px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .empty{color:var(--mut);font-style:italic;text-align:center;padding:28px 0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:.84rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
  .drawer-bg.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:#fff;box-shadow:-4px 0 18px rgba(0,0,0,.18);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:31}
  .drawer.show{transform:translateX(0)}
  .drawer h3{font-size:1.05rem;margin-bottom:4px}
  .drawer .x{position:absolute;top:14px;right:16px;cursor:pointer;font-size:1.3rem;color:var(--mut);background:none;border:none}
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:10px}
  .timeline div{font-size:.8rem}.timeline b{font-size:.7rem;color:var(--blue);display:block}
  .pill{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--blue)}
  .note{font-size:.78rem;color:var(--mut);margin-top:10px}
  .legacy-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:9px 12px;font-size:.78rem;margin-bottom:14px}
  /* ── Sales search ── */
  .sales-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .sales-controls .field{flex:1;min-width:130px;margin-bottom:0}
  .datetime-row{display:flex;gap:5px}
  .datetime-row input{flex:1}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
  .view-toggle button{border:none;background:#fff;padding:7px 11px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--mut)}
  .view-toggle button.on{background:var(--blue);color:#fff}
  .sales-summary-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .sales-stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fafbff}
  .sales-stat .val{font-size:1.6rem;font-weight:700;color:var(--blue);line-height:1}
  .sales-stat small{color:var(--mut)}
  .bar-bg{background:#e5e7eb;border-radius:4px;height:8px;overflow:hidden;min-width:50px}
  .bar-fill{background:var(--blue);height:100%;border-radius:4px}
  .sales-table{width:100%;border-collapse:collapse;font-size:.83rem}
  .sales-table th{text-align:left;padding:7px 9px;border-bottom:2px solid var(--line);font-weight:700;color:var(--mut);font-size:.73rem}
  .sales-table td{padding:6px 9px;border-bottom:1px solid var(--line)}
  .sales-table .right{text-align:right}
  .sales-status{padding:7px 10px;border-radius:8px;font-size:.79rem;font-weight:600;margin-bottom:10px}
  .sales-status.error{background:#fee2e2;color:#b91c1c}
  .sales-status.loading{background:#dbeafe;color:#1e40af}
  .cap-note{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:7px 11px;font-size:.78rem;margin-bottom:10px}
  .btn.success{background:#16a34a;color:#fff}
  .btn.success:hover{background:#15803d}
  /* ── Work Order sheet (mirrors the KNM paper form) ─────────────────────── */
  .wo-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;z-index:40;overflow:auto;padding:24px 12px}
  .wo-bg.show{display:block}
  .wo{max-width:820px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:0 0 18px;position:relative}
  .wo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:2px solid var(--ink)}
  .wo-top h2{font-size:1.3rem;font-weight:800;line-height:1.15}
  .wo-top .co{font-size:.72rem;color:var(--mut);line-height:1.5;margin-top:5px}
  .wo-top .rt{text-align:right;font-size:.72rem;color:var(--mut);white-space:nowrap}
  .wo-top .rt b{display:block;font-size:1rem;color:var(--ink);letter-spacing:.04em}
  .wo-body{padding:16px 22px}
  .wo-x{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.5rem;color:var(--mut);cursor:pointer;line-height:1}
  .wo-sec{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#4b5563;margin:20px 0 7px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .wo-sec span{font-weight:500;text-transform:none;letter-spacing:0}
  .wo-req{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:11px 13px;margin-bottom:10px}
  .wo-req h4{font-size:.78rem;color:#92400e;margin-bottom:3px}
  .wo-req .ref{font-size:.68rem;font-weight:700;color:#b45309;margin-bottom:6px}
  .wo-req .f{font-size:.8rem;margin-top:4px}
  .wo-req .verbatim{background:#fff;border:1px solid #fde68a;border-radius:6px;padding:6px 8px;margin-top:3px;max-height:96px;overflow:auto;white-space:pre-wrap;font-size:.79rem}
  table.wo-t{width:100%;border-collapse:collapse;font-size:.8rem}
  table.wo-t th{background:#9ca3af;color:#fff;font-weight:700;font-size:.72rem;text-align:left;padding:6px 9px}
  table.wo-t td{border-bottom:1px solid var(--line);padding:5px 9px;vertical-align:middle}
  table.wo-t tbody tr:nth-child(odd){background:#f9fafb}
  table.wo-t input[type=text],table.wo-t input[type=number]{height:32px;padding:4px 8px;font-size:.8rem}
  table.wo-t input[type=number]{width:84px;text-align:center}
  table.wo-t .c{text-align:center}
  table.wo-t input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}
  .wo-ord{font-size:.68rem;color:#1d4ed8;font-weight:700}
  .wo-cust{border:1px dashed #d1d5db;border-radius:9px;padding:10px 12px;margin-top:16px}
  .wo-cust.on{border-color:#f59e0b;background:#fffbeb}
  .wo-cust textarea{display:none;margin-top:8px}
  .wo-cust.on textarea{display:block}
  .wo-cust label{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;margin:0}
  .wo-cust label input{width:16px;height:16px;flex:0 0 auto;margin-top:1px;accent-color:#d97706}
  .wo-act{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .wo-sig{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;z-index:60;align-items:center;justify-content:center;padding:16px}
  .wo-sig.show{display:flex}
  .wo-sig .box{background:#fff;border-radius:12px;padding:20px;width:min(420px,96vw)}
  .wo-sig h3{font-size:1rem;margin-bottom:4px}
  .wo-attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:4px}
  .wo-attrs .field{margin-bottom:0}
  .wo-attrs select{height:36px}
  /* ── Dispatch board ── */
  .bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
  .bd-c{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px}
  .bd-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;
        padding-bottom:8px;border-bottom:1px solid var(--line)}
  .bd-h b{font-size:.85rem}
  .bd-h .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bd-h .em{display:block;font-size:.68rem;color:var(--mut);font-weight:500}
  .slot{display:flex;align-items:center;gap:7px;border:1px dashed #cbd5e1;border-radius:8px;
        padding:6px 8px;min-height:38px;margin-bottom:6px;background:#fcfdff}
  .slot.on{border-style:solid;border-color:var(--line);background:#fff}
  .slot .n{font-size:.64rem;font-weight:800;color:#94a3b8;width:15px;flex:0 0 auto;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .slot .b{flex:1;min-width:0}
  .slot .b b{display:block;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .b small{font-size:.66rem;color:var(--mut)}
  .slot select{font-size:.74rem;height:28px;padding:2px 6px;flex:1;min-width:0}
  .slot .x{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1rem;line-height:1;padding:0 2px}
  .slot .x:hover{color:var(--bad)}
  .slot .add{background:none;border:none;color:var(--blue);font-size:.74rem;font-weight:700;
             cursor:pointer;text-align:left;flex:1;padding:0}
  .bd-un{border:1px solid #fde68a;background:#fffbeb;border-radius:11px;padding:11px 12px}
  /* ── stop composer ── */
  .daybar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
          border-radius:10px;padding:9px 11px;margin-bottom:12px}
  .daybar input[type=date]{width:auto;padding:6px 9px;font-size:.8rem;font-weight:600}
  .daybar label{font-size:.76rem;font-weight:600;display:flex;gap:5px;align-items:center;margin:0}
  .sbox{position:relative;margin-bottom:8px}
  .sbox input{font-size:.78rem;height:32px;padding:4px 9px}
  .sres{position:absolute;left:0;right:0;top:34px;z-index:20;background:#fff;border:1px solid var(--line);
        border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);max-height:210px;overflow:auto;display:none}
  .sres.show{display:block}
  .sres button{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 9px;
               font-size:.76rem;cursor:pointer;font-family:inherit;color:inherit}
  .sres button:hover,.sres button:focus{background:#eef2ff;outline:none}
  .sres button small{display:block;color:var(--mut);font-size:.66rem}
  .sres .none{padding:8px 9px;font-size:.74rem;color:var(--mut);font-style:italic}
  .comp{border:1.5px solid var(--blue);border-radius:9px;padding:9px 10px;margin-bottom:9px;background:#f8faff}
  .comp .t{font-size:.78rem;font-weight:800;margin-bottom:2px}
  .comp .c{font-size:.66rem;color:var(--mut);margin-bottom:7px}
  .comp .ticks{display:flex;gap:12px;margin-bottom:7px;flex-wrap:wrap}
  .comp .ticks label{display:flex;gap:5px;align-items:center;font-size:.76rem;font-weight:700;margin:0;
                     text-transform:none;letter-spacing:0;color:var(--ink)}
  .comp .ticks input{width:16px;height:16px;accent-color:var(--blue)}
  .comp textarea{min-height:42px;font-size:.76rem;padding:5px 8px}
  .comp .row2{display:flex;gap:7px;align-items:center;margin-top:7px}
  .comp select{height:30px;font-size:.74rem;padding:2px 6px;width:auto;flex:0 0 auto}
  .comp .row2 .btn{flex:1}
  .stp{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line);border-radius:8px;
       padding:6px 8px;margin-bottom:6px;background:#fff}
  .stp .n{font-size:.64rem;font-weight:800;color:#94a3b8;width:15px;flex:0 0 auto;margin-top:2px;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .stp .b{flex:1;min-width:0}
  .stp .b b{display:block;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stp .b .k{display:flex;gap:4px;margin:3px 0 2px;flex-wrap:wrap}
  .stp .b small{display:block;font-size:.68rem;color:var(--mut);white-space:normal}
  .stp .x{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1rem;line-height:1;padding:0 2px}
  .stp .x:hover{color:var(--bad)}
  .stp .ed{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:.95rem;line-height:1;padding:0 2px}
  .stp .ed:hover{color:var(--blue)}
  .stp.carry{border-style:dashed;border-color:var(--amber-br);background:#fffbeb}
  .stp-ed{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
  .stp-ed textarea{min-height:38px;font-size:.74rem;padding:4px 7px;margin-bottom:4px}
  .stp-ed .nl{font-size:.6rem;font-weight:800;letter-spacing:.06em;color:var(--mut);margin:2px 0 2px;
              display:flex;gap:5px;align-items:center;text-transform:none}
  .stp-ed .nl input{width:14px;height:14px;accent-color:var(--blue)}
  .stp-ed .r{display:flex;gap:6px;margin-top:5px}
  .stp-ed select,.stp-ed input[type=date]{height:28px;font-size:.72rem;padding:2px 6px}
  .stp-ed .btn{flex:1}
  .kpi small b{display:inline;font-size:inherit;font-weight:800;color:var(--ink);line-height:inherit}
</style>
</head>
<body>

<header>
  <div class="brand">KNM Ops <small>streamlined — beta</small></div>
  <div class="rolepick">
    <span>Signed in as</span>
    <select id="rolesel"></select>
  </div>
</header>
<div class="banner demo" id="banner">Loading…</div>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="drawer-bg" id="drawerbg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><button class="x" onclick="closeDrawer()">×</button><div id="drawerc"></div></div>
<div class="wo-bg" id="woBg"><div class="wo" id="woSheet"></div></div>
<div class="wo-sig" id="woSig"><div class="box">
  <h3>Receiving Personnel signature</h3>
  <p class="note" style="margin:0 0 12px">The customer's representative confirms services rendered and goods delivered are in good order.</p>
  <div class="field"><label>Name (typed signature)</label><input id="woSigName" placeholder="Full name"></div>
  <div class="field"><label>Date</label><input type="date" id="woSigDate"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px">
    <button class="btn ghost" onclick="woSigClose()">Cancel</button>
    <button class="btn ghost" onclick="woSigUnavailable()">Customer unavailable</button>
    <button class="btn" onclick="woSigConfirm()">Sign &amp; submit</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* Streamlined UI (alpha) — reads from /alpha/api/bootstrap and WRITES through the
   existing production work-order API (/api/wo/*): same validation, role checks,
   activity log, top-up sync and movement location-cutover as the main dashboard. */
const ME = {{ (username or "") | tojson }};
const MYROLES = ({{ (roles or []) | tojson }}).map(r=>String(r||"").toLowerCase())
  .map(r=>({dispatch:"field_manager"}[r]||r)).filter((v,i,a)=>a.indexOf(v)===i);

const AREAS={fleet:"Fleet",machines:"Machines",service:"Service",plan:"Plan",admin:"Admin"};
const ROLE_NAV={
  operator:["service","machines"], customer_service:["service","machines"],
  field_manager:["plan","service","fleet","machines"],
  sales:["fleet","service"], admin:["plan","service","fleet","machines","admin"]};
/* dispatch is merged into field_manager (app.ROLE_ALIASES): one entry, one tab
   order, one landing tab — Plan, because the board is the morning job. */
const ROLE_HOME={operator:"service",customer_service:"service",field_manager:"plan",sales:"fleet",admin:"plan"};
const ROLE_LABEL={operator:"Operator (driver)",customer_service:"Customer Service",field_manager:"Dispatch / Field Manager",sales:"Sales",admin:"Admin"};
/* Client-side mirror of app.ROLE_ALIASES. The server already canonicalises, but
   a cached page or a stale cookie carrying "dispatch" would otherwise match no
   ROLE_NAV key and silently drop the user into the customer_service view. */
const ROLE_ALIAS={dispatch:"field_manager"};
const canonRole=r=>{const v=String(r||"").toLowerCase();return ROLE_ALIAS[v]||v;};

let state={role:"customer_service",area:"service",sub:{},seq:{REP:9000},salesVends:null};
let machines=[], work=[], live=false;
let techs=[];                    // [{email,name}] from /api/wo/technicians
const techEmails=()=>techs.map(t=>t.email).filter(Boolean);
let drivers=[];                  // assignment targets (emails) — filled at boot

async function api(path,opts={}){
  try{
    const res=await fetch(path,{method:opts.method||"GET",
      headers:{"Content-Type":"application/json"},
      body:opts.body!==undefined?JSON.stringify(opts.body):undefined});
    let d=null; try{d=await res.json();}catch(_){}
    if(!res.ok||(d&&d.error)){toast((d&&d.error)||("Request failed ("+res.status+")"));return null;}
    return d||{ok:true};
  }catch(e){toast("Network error — "+e);return null;}
}
async function reload(){
  const d=await api("/alpha/api/bootstrap"); if(!d)return;
  machines=(d.machines||[]).map(m=>({vendsSince:null,...m}));
  work=d.work||[]; state.salesVends=d.health?d.health.salesVends:null;
  setBanner(d.health); render();
}

/* The /api/wo/* endpoints resolve the caller's role from the knm_active_role

   a stale cookie from the main dashboard 403s every work-order call. Only ever
   set to a role the user actually holds — the server re-validates anyway. */
function readRoleCookie(){
  const m=document.cookie.match(/(?:^|;\s*)knm_active_role=([^;]*)/);
  return m?canonRole(decodeURIComponent(m[1])):"";}
function syncRoleCookie(){
  if(!MYROLES.includes(state.role))return;
  document.cookie="knm_active_role="+encodeURIComponent(state.role)+";path=/;max-age=604800;samesite=Lax";}

  sel.onchange=()=>{state.role=sel.value;syncRoleCookie();state.area=ROLE_HOME[state.role];state.sub={};render();toast("Switched to "+ROLE_LABEL[state.role]);};

async function assign(id){const w=work.find(x=>x.id===id);const d=($("#as_"+cssId(id)).value||"").trim();

  else if(w.kind==="complaint")r=await api("/api/wo/joborders",{method:"POST",body:{complaint_id:w.rid,assigned_to:d,

let WO={det:null,visit:null,busy:false};
const woEsc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const woToday=()=>new Date().toLocaleDateString("en-CA");  // LOCAL yyyy-mm-dd, not UTC

async function openWorkOrder(code){
  if(WO.busy)return; WO.busy=true;
  try{
    const det=await api(`/api/wo/operator/location/${encodeURIComponent(code)}`);
    if(!det)return;
    if(!(det.service_wos||[]).length && !det.delivery_wo){
      toast("Nothing open on this machine for you — it may already be submitted.");return;}
    const st=await api("/api/wo/visits/start",{method:"POST",body:{
      machine_code:code,
      service_job_order_ids:(det.service_wos||[]).map(x=>x.id),
      delivery_order_id:det.delivery_wo?det.delivery_wo.id:null}});
    if(!st||!st.visit)return;

    renderWorkOrder(); $("#woBg").classList.add("show");

}

function renderWorkOrder(){

  <div class="wo-top">
    <div><h2>Kopi Near Me Pte. Ltd.</h2>

  (d.service_wos||[]).forEach(wo=>{

      if(wo.complaint_urgency)l.push("urgency: "+woEsc(wo.complaint_urgency));
      if(l.length)b+=`<div style="font-size:.72rem;color:#92400e;margin-top:3px">${l.join(" · ")}</div>`;}
    if(wo.attached_kb&&wo.attached_kb.title)b+=`<div class="f"><b>KB ref:</b> ${woEsc(wo.attached_kb.title)}</div>`;
    if(wo.attached_kb&&wo.attached_kb.corrective_action)b+=`<div class="f"><b>Corrective action:</b> ${woEsc(wo.attached_kb.corrective_action)}</div>`;
    if(wo.diagnosis)b+=`<div class="f"><b>Diagnosis:</b> ${woEsc(wo.diagnosis)}</div>`;
    if(wo.proposed_fix)b+=`<div class="f"><b>Proposed fix:</b> ${woEsc(wo.proposed_fix)}</div>`;
    h+=`<div class="wo-req"><h4>⚠ Service requested</h4><div class="ref">${woEsc(wo.display_id||"#"+wo.id)} · ${woEsc(wo.priority_label||"normal")}</div>${b}</div>`;});

  // A merged stop carries its service request on the delivery order itself.

    h += `<div class="wo-req"><h4>⚠ Service requested</h4>
      <div class="ref">Dispatch · ${woEsc(v.visit_date || woToday())}</div>

  }

  h+=`<div class="grid2">
    <div class="field"><label>Company / Location</label><input type="text" readonly value="${woEsc(mc.name||mc.code)}"></div>
    <div class="field"><label>Date</label><input type="date" value="${woEsc(v.visit_date||woToday())}" disabled></div></div>
  <div class="grid2">
    <div class="field"><label>Machine Code</label><input type="text" readonly value="${woEsc(mc.code)}"></div>

  // ── Machine attributes. Options come from the server (workorders.py
  // MACHINE_ATTRS) and are rendered verbatim — never hardcoded here, so the

  if(spec.length){

    h+=`<div class="wo-sec">Machine details ${anyMissing

  h+=`<div class="wo-sec">Services</div><table class="wo-t">
    <thead><tr><th style="width:52%">Description</th><th style="width:90px" class="c">Completed</th><th>Remarks</th></tr></thead><tbody>`;

  h+=`<div class="wo-sec">Delivery <span>${sched?"— scheduled top-up":"— optional; record anything you replenish on site"}</span></div>
   ${dnote?`<div class="wo-req"><h4>Dispatch note</h4><div class="verbatim">${woEsc(dnote)}</div></div>`:""}
   <table class="wo-t"><thead><tr><th style="width:46%">Description</th><th>Unit</th><th>Content</th><th class="c">Qty</th></tr></thead><tbody>`;
  (d.delivery_items||[]).forEach(it=>{const qo=ord[it.id],qd=del[it.id];
    h+=`<tr><td>${woEsc(it.name)}${qo?` <span class="wo-ord">(${qo} ordered)</span>`:""}</td>
      <td>${woEsc(it.unit)}</td><td>${woEsc(it.content)}</td>
      <td class="c"><input type="number" min="0" max="999" placeholder="${qo!=null?qo:0}" data-item-id="${it.id}" data-had="${qd!=null?1:0}" value="${qd!=null?qd:""}"></td></tr>`;});

    <div class="wo-act">

function woBody(){
  const svc={};
  (WO.det.service_categories||[]).forEach(c=>{svc[c.code]={
    done:$("#woS_"+c.code+"_d").checked,
    remarks:($("#woS_"+c.code+"_r").value||"").trim()};});
  const lines=[];
  document.querySelectorAll('#woSheet input[type=number][data-item-id]').forEach(i=>{
    // Blank means "not touched" — never send it, or an untouched sheet would
    // insert a zero line for all 17 catalogue items and wipe the ordered qtys.
    // The one exception is clearing a qty that was previously saved.
    if(i.value==="" && i.dataset.had!=="1")return;
    lines.push({item_id:parseInt(i.dataset.itemId,10),qty_delivered:parseInt(i.value,10)||0});});
  const ctr=$("#woCounter").value;
  const attrs={};
  document.querySelectorAll("#woSheet select[data-attr]").forEach(s=>{
    if(s.value)attrs[s.dataset.attr]=s.value;});
  return {dispense_counter:ctr!==""?parseInt(ctr,10):null,services:svc,delivery_lines:lines,
    machine_attrs:attrs,
    service_name:($("#woSvcName").value||"").trim()||null,
    service_date:$("#woSvcDate").value||null,
    customer_unavailable:$("#woCustChk").checked,
    customer_unavailable_reason:($("#woCustReason").value||"").trim()||null};}

async function woSave(notify){
  const r=await api(`/api/wo/visits/${WO.visit.id}`,{method:"PATCH",body:woBody()});
  // A registry problem must reach the technician HERE — woSave runs before the
  // signature modal, so this is the last moment it can be raised without the
  // customer having already signed.
  if(r&&r.machine_attrs_warning)toast(r.machine_attrs_warning);
  else if(r&&notify)toast("Draft saved.");
  return !!r;}

async function woSubmit(){
  if(!($("#woSvcName").value||"").trim()){toast("Enter your name (Service Personnel) first.");return;}
  // Machine details are checked HERE, before the signature modal opens — never
  // after, or the customer would sign and then the submit would bounce.
  const blank=[...document.querySelectorAll("#woSheet select[data-attr]")].filter(s=>!s.value);
  if(blank.length){
    blank.forEach(s=>{s.style.borderColor="#b45309";s.style.background="#fffbeb";});
    blank[0].scrollIntoView({block:"center",behavior:"smooth"}); blank[0].focus();
    toast("Confirm the machine details first ("+blank.length+" left).");return;}
  if(!(await woSave(false)))return;
  $("#woSigName").value=""; $("#woSigDate").value=woToday();
  $("#woSig").classList.add("show");}
function woSigClose(){$("#woSig").classList.remove("show");}

function woSigConfirm(){
  const nm=($("#woSigName").value||"").trim(), dt=$("#woSigDate").value;
  if(!nm){toast("Receiving personnel name required.");return;}
  if(!dt){toast("Date required.");return;}
  woFinalize({receiving_name:nm,receiving_date:dt,customer_unavailable:false,
    service_name:($("#woSvcName").value||"").trim(),service_date:$("#woSvcDate").value});}

function woSigUnavailable(){
  let rsn=($("#woCustReason").value||"").trim();
  if(!rsn){rsn=(prompt("Customer unavailable — brief reason (flagged to manager):")||"").trim();
    if(!rsn){toast("Reason required.");return;}
    $("#woCustReason").value=rsn; $("#woCustChk").checked=true; $("#woCustBox").classList.add("on");}
  woFinalize({customer_unavailable:true,customer_unavailable_reason:rsn,
    service_name:($("#woSvcName").value||"").trim(),service_date:$("#woSvcDate").value});}

let woSubmitting=false;
async function woFinalize(body){
  if(woSubmitting){toast("Submitting — please wait.");return;}
  woSubmitting=true;
  document.querySelectorAll("#woSig .btn").forEach(b=>b.disabled=true);
  let r,vid=WO.visit.id;
  try{ r=await api(`/api/wo/visits/${vid}/finalize`,{method:"POST",body}); }
  finally{ woSubmitting=false;
    document.querySelectorAll("#woSig .btn").forEach(b=>b.disabled=false); }
  if(!r)return;
  woSigClose(); closeWorkOrder(); await reload();
  const skipped=(r.skipped_job_orders||[]).length;
  toast((r.status==="pending_email_signature"
      ? "Submitted — customer unavailable; manager flagged for sign-off."
      : "Work Order signed and submitted.")
    + (skipped?` ${skipped} job order(s) had already been closed or reassigned.`:"")
    + (r.pdf_ready?"":" PDF could not be filed — tell a manager."));
  // Link rather than window.open: this runs after awaits, so iOS Safari would
  // block a popup. finalize reports whether the PDF actually filed.
  if(r.pdf_ready)woPdfLink(vid);}
function woPdfLink(vid){
  const a=document.createElement("a");
  a.href=`/api/wo/visits/${vid}/pdf`; a.target="_blank"; a.rel="noopener";
  a.className="btn"; a.textContent="Open signed Work Order PDF";
  a.style.cssText="position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:70;text-decoration:none";
  a.onclick=()=>setTimeout(()=>a.remove(),100);
  document.body.appendChild(a); setTimeout(()=>a.remove(),20000);}
function svcKB(){return `<div class="rows">${kb.map(k=>`<div class="row"><div class="grow"><b>${k.id} — ${k.sym}</b><div class="meta">Root: ${k.root} · Fix: ${k.fix}</div></div>${(state.role==="field_manager"||state.role==="admin")?'<button class="btn sm ghost">Edit</button>':''}</div>`).join("")}</div><p class="note">CAR-format KB, inline from any job (was the Manage KB tab). Demo entries.</p>`;}
function listWork(arr,empty){if(!arr.length)return `<p class="empty">${empty||"Nothing here."}</p>`;
  return `<div class="rows">${arr.map(w=>{const m=mByCode(w.machine);return `<div class="row"><span class="dot ${m?m.status:'g'}"></span>
    <div class="grow"><b>${woEsc(wName(w))} — ${woEsc(w.desc)}</b><div class="meta">${woEsc(w.id)} · ${woEsc(driverName(w.assignedTo))} · ${woEsc(w.source)}</div></div>
    <span class="tag ${tagFor(w.type)}">${tagTxt(w.type)}</span>${statusTag(w)}</div>`;}).join("")}</div>`;}

/* MACHINES */
function machinesFor(){const cur=subActive("machines","active");const q=(state.mq||"").trim().toLowerCase();
  return machines.filter(m=>(cur==="active"?m.active:!m.active) &&
    (!q || (m.name||"").toLowerCase().includes(q) || (m.code||"").toLowerCase().includes(q)));}
function machineRowsHtml(){const canEdit=["admin","dispatch","field_manager"].includes(state.role);const list=machinesFor();
  if(!list.length) return '<p class="empty">No machines match your search.</p>';
  return list.map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${woEsc(m.name)}</b>
    <div class="meta">${m.code} · ${m.lat??'?'}, ${m.lon??'?'} · last refill ${m.lastRefill}</div></div>
    <button class="btn sm ghost" onclick="openMachine('${m.code}')">Info · History${canEdit?' · Edit':''}</button></div>`).join("");}
function renderMachineList(){const el=document.getElementById("mList");if(el)el.innerHTML=machineRowsHtml();
  const c=document.getElementById("mCount");if(c)c.textContent=machinesFor().length;}
function renderMachines(){const cur=subActive("machines","active");const canEdit=["admin","dispatch","field_manager"].includes(state.role);
  return `<div class="screen-h"><div><h2>Machines</h2><div class="crumb">One registry — Locations + Historic Locations + Machine History</div></div>${state.role==="admin"&&cur==="active"?'<button class="btn ghost" onclick="openAddMachine()">+ Add machine</button>':''}</div>
    <div class="subnav"><button data-sub="active" class="${cur==='active'?'on':''}">Active (${machines.filter(m=>m.active).length})</button>
      <button data-sub="decom" class="${cur==='decom'?'on':''}">Decommissioned (${machines.filter(m=>!m.active).length})</button></div>
    <input id="mSearch" type="search" placeholder="Search machine name or code…" value="${(state.mq||'').replace(/"/g,'&quot;')}"
      oninput="state.mq=this.value;renderMachineList()" style="width:280px;margin-bottom:8px">
    <div class="meta" style="margin-bottom:8px"><b id="mCount">${machinesFor().length}</b> shown</div>
    <div class="rows" id="mList">${machineRowsHtml()}</div>`;}
function openMachine(code){const m=mByCode(code);const wos=work.filter(w=>w.machine===code);
  drawer(`<h3>${woEsc(m.name)}</h3><span class="pill">${woEsc(m.code)}</span> <span class="pill">${m.active?'active':'decommissioned'}</span>
    <div class="grid2" style="margin-top:12px"><div class="field"><label>Name</label><input value="${woEsc(m.name)}"></div>
      <div class="field"><label>Code</label><input value="${m.code}"></div><div class="field"><label>Lat</label><input value="${m.lat??''}"></div>
      <div class="field"><label>Lon</label><input value="${m.lon??''}"></div></div>
    <h3 style="font-size:.92rem;margin:8px 0 8px">History (work + visits)</h3>
    <div class="timeline">${wos.length?wos.map(w=>`<div><b>${woEsc(w.id)} · ${tagTxt(w.type)} · ${woEsc(w.status)}</b>${woEsc(w.desc)}</div>`).join(""):'<div class="meta">No work recorded.</div>'}</div>
    <p class="note">Info / History / status in one drawer. (Edits are preview-only.)</p>`);}

function openAddMachine(){
  drawer(`<h3>Add machine</h3><p class="note">Registers the machine in the live registry and opens its location history at the current site.</p>
    <div class="field"><label>Location name (required)</label><input id="am_name" placeholder="e.g. UPS House"></div>
    <div class="field"><label>Machine code (required)</label><input id="am_code" placeholder="e.g. 54020502"></div>
    <div class="grid2"><div class="field"><label>Lat</label><input id="am_lat" placeholder="1.3402"></div>
      <div class="field"><label>Lon</label><input id="am_lon" placeholder="103.8896"></div></div>
    <button class="btn" onclick="submitAddMachine()">Add machine</button>`);}
async function submitAddMachine(){
  const name=($("#am_name").value||"").trim(), code=($("#am_code").value||"").trim();
  const lat=($("#am_lat").value||"").trim(), lon=($("#am_lon").value||"").trim();
  if(!name||!code){toast("Location name and machine code are required.");return;}
  if(!live){toast("Demo mode — backend unreachable, nothing saved.");return;}
  const r=await api("/api/admin/locations",{method:"POST",body:{name,code,lat:lat||null,lon:lon||null}});
  if(!r)return; closeDrawer(); await reload(); toast(name+" ("+code+") added");}

/* FLEET */
function renderFleet(){const cur=subActive("fleet","status");
  const A=machines.filter(m=>m.active);const g=A.filter(m=>m.status==="g").length,y=A.filter(m=>m.status==="y").length,r=A.filter(m=>m.status==="r").length;
  let body;
  if(cur==="sales")body=renderSalesUI();
  else if(cur==="events")body=`<div class="rows">${A.filter(m=>m.status!=="g").slice(0,12).map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${woEsc(m.name)}</b><div class="meta">${m.status==='r'?'silent past threshold':'recent error/exception'}</div></div></div>`).join("")||'<p class="empty">No active alerts.</p>'}</div><p class="note">Derived from heartbeat (was Messages tab).</p>`;
  else if(cur==="refill")body=`<div class="rows">${A.map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${woEsc(m.name)}</b><div class="meta">${m.vendsSince==null?'vends since refill: —':m.vendsSince+' vends since refill'} · last ${m.lastRefill}</div></div></div>`).join("")}</div><p class="note">Read-only refill status so Sales keeps top-up visibility. Logging happens in Plan / My Jobs.</p>`;
  else body=`<div class="kpis"><div class="kpi"><b style="color:var(--ok)">${g}</b><small>🟢 online</small></div><div class="kpi"><b style="color:var(--warn)">${y}</b><small>🟡 warning</small></div><div class="kpi"><b style="color:var(--bad)">${r}</b><small>🔴 silent</small></div></div>
    <div class="rows">${A.map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${woEsc(m.name)}</b><div class="meta">${m.status==='r'?'silent — needs attention':m.status==='y'?'warning':'online'}</div></div>${m.status!=='g'?`<button class="btn sm ghost" onclick="fleetReport('${m.code}')">Report fault</button>`:''}</div>`).join("")}</div>
    <p class="note">Live heartbeat (was Heartbeat tab). "Report fault" opens Service ▸ Report.</p>`;
  return `<div class="screen-h"><div><h2>Fleet</h2><div class="crumb">Monitor — Sales + Messages + Heartbeat (+ refill status)</div></div></div>
    <div class="subnav"><button data-sub="status" class="${cur==='status'?'on':''}">Live status</button><button data-sub="sales" class="${cur==='sales'?'on':''}">Sales</button>
      <button data-sub="events" class="${cur==='events'?'on':''}">Event log</button><button data-sub="refill" class="${cur==='refill'?'on':''}">Refill status</button></div>${body}`;}
function fleetReport(code){if(!ROLE_NAV[state.role].includes("service")){toast("This role has read-only Fleet.");return;}
  state.area="service";state.sub.service=(state.role==="field_manager"||state.role==="admin")?"triage":"report";render();if($("#rep_m"))$("#rep_m").value=code;toast("Reporting fault on "+code);}

/* PLAN */
const openWork = () => work.filter(w => w.status !== "done");
/* Date.now() is already UTC-epoch, so SGT is a flat +8. Adding the browser's
   own offset on top double-counted it and returned yesterday for the whole
   00:00–08:00 SGT window — i.e. exactly when the morning round gets planned. */
const sgtToday = () => new Date(Date.now() + 480 * 60000).toISOString().slice(0, 10);
let boardDate = sgtToday();
let showCarry = true;          // include open work with no scheduled date
let BOARD_SITES = [];

/* A stop = one machine, one driver, one day. The underlying rows are the
   delivery order and/or job order that already exist. */
function stopsOnBoard(){
  return openWork().filter(w =>
    w.scheduledDate === boardDate || (showCarry && !w.scheduledDate));
}
function buildSites(){
  const by = {};
  stopsOnBoard().forEach(w => {
    if (!w.machine || w.machine === "?") return;   // cannot be a stop; stays in the list below
    const s = by[w.machine] = by[w.machine] || {code: w.machine, name: null, items: []};
    s.items.push(w);
    if (!s.name) { const m = mByCode(w.machine); s.name = m ? m.name : (w.machineName || null); }
  });
  BOARD_SITES = Object.values(by).map(s => (s.name = s.name || s.code, s));
  return BOARD_SITES;
}
const seqOf = s => Math.min(...s.items.map(w => w.routeSeq == null ? 9999 : w.routeSeq));

function setBoardDate(v){ boardDate = v || sgtToday(); render(); }
function shiftBoardDate(d){
  // Parse and step in UTC. Parsing as local and formatting as UTC made Next a
  // no-op and Prev a two-day jump for any browser east of Greenwich.
  const t = new Date(boardDate + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + d);
  boardDate = t.toISOString().slice(0, 10); render();
}
function toggleCarry(el){ showCarry = el.checked; render(); }

function renderPlan(){
  const open = openWork(), un = open.filter(w => !w.assignedTo);
  buildSites();
  const cnt = t => open.filter(w => w.type === t && w.kind !== "complaint").length;
  const unc = t => un.filter(w => w.type === t && w.kind !== "complaint").length;
  const kpi = (t, lbl) => `<div class="kpi"><b>${cnt(t)}</b><small>${lbl} open · <b>${unc(t)}</b> unassigned</small></div>`;
  const comp = un.filter(w => w.kind === "complaint").length;
  const carry = openWork().filter(w => !w.scheduledDate).length;

  // Every operator is schedulable. Whether Graph currently lists them under the
  // Operator app role is not the board's business — dispatch decides who goes
  // where. Cards = the roster, plus anyone already holding work, plus anyone
  // added by hand.
  const people = boardPeople();

  const noRoster = !drivers.length ? `<div class="legacy-note">
      <b>Driver roster did not load</b> — <code>/api/wo/technicians</code> is Graph-backed; check
      <code>MS_EASYAUTH_SP_OBJECT_ID</code> / <code>MS_OPERATOR_ROLE_ID</code>, or open
      <code>/api/wo/technicians/diag</code> as admin. Names show as email addresses until it
      returns; scheduling works either way. Add a driver:
      <input id="adhocDrv" placeholder="operator@kopinearme.com" style="width:220px;display:inline-block;margin:0 6px;height:28px;font-size:.76rem">
      <button class="btn sm" onclick="addAdhocDriver()">Add card</button></div>` : "";

  return `<div class="screen-h"><div><h2>Plan</h2>
      <div class="crumb">Search a machine on a driver's card, tick what is needed, add the stop.</div></div>
      <button class="btn" onclick="autoPlan()">Auto-plan routes</button></div>
    <div class="kpis">${kpi("delivery","deliveries")}${kpi("service","service")}${kpi("movement","movements")}
      <div class="kpi"><b>${un.length - comp}</b><small>assignable now${comp ? ` · <b>${comp}</b> complaint${comp!==1?"s":""} awaiting a job order` : ""}</small></div></div>
    ${noRoster}
    <div class="daybar">
      <button class="btn sm ghost" onclick="shiftBoardDate(-1)">‹ Prev</button>
      <input type="date" value="${boardDate}" onchange="setBoardDate(this.value)">
      <button class="btn sm ghost" onclick="shiftBoardDate(1)">Next ›</button>
      <button class="btn sm ghost" onclick="setBoardDate(sgtToday())">Today</button>
      ${carry ? `<label><input type="checkbox" ${showCarry ? "checked" : ""} onchange="toggleCarry(this)">
        Include ${carry} undated item${carry !== 1 ? "s" : ""}</label>` : ""}
      <span style="flex:1"></span>
      <input id="adhocDrv2" placeholder="add a driver by email" style="width:210px;height:30px;font-size:.76rem">
      <button class="btn sm ghost" onclick="addAdhocDriver('adhocDrv2')">+ Driver</button>
    </div>
    ${people.length ? `<div class="bd">${people.map(driverCard).join("")}</div>`
                    : '<p class="empty">No drivers yet — add one above.</p>'}
    ${(() => { const cl = open.filter(w => (!w.machine || w.machine === "?") && w.assignedTo);
        return cl.length ? `<div class="legacy-note" style="margin-top:12px"><b>${cl.length} assigned item(s) have no machine code</b>
          and cannot appear on the board: ${cl.map(w => woEsc(w.id)).join(", ")}. Fix the machine code in the main dashboard.</div>` : ""; })()}
    <h3 style="font-size:.95rem;margin:18px 0 8px">Unassigned work — ${un.length - comp} assignable${comp ? `, ${comp} awaiting a job order` : ""}</h3>
    ${un.length ? `<div class="rows">${un.map(triageRow).join("")}</div>`
                : '<p class="empty">Nothing unassigned.</p>'}
    <p class="note">Live — every action writes through the same work-order API the main dashboard uses.</p>`;
}

function driverCard(email){
  const lc = (email || "").toLowerCase();
  const mine = BOARD_SITES.filter(s => s.items.some(w => (w.assignedTo || "").toLowerCase() === lc))
                          .sort((a, b) => seqOf(a) - seqOf(b));

  const stops = mine.map((s, i) => {
    const his = s.items.filter(w => (w.assignedTo || "").toLowerCase() === lc);
    const carried = his.every(w => !w.scheduledDate);
    const kinds = his.map(w => `<span class="tag ${tagFor(w.type)}">${tagTxt(w.type)}</span>`).join("");
    const note = his.map(w => w.desc).filter(d => d && d !== "Refill / delivery")[0];
    return `<div class="stp${carried ? " carry" : ""}" data-code="${woEsc(s.code)}">
      <span class="n">${i + 1}</span>
      <span class="b"><b>${woEsc(s.name)}</b><span class="k">${kinds}${
        carried ? '<span class="tag" title="No scheduled date — carried over">UNDATED</span>' : ""}</span>
        ${note ? `<small>${woEsc(note)}</small>` : ""}
        <span class="edit"></span></span>
      <button class="ed" title="Edit this stop" onclick="editStop(this)">✎</button></div>`;
  }).join("");

  // The composer is on EVERY card. "Off roster" only means Graph did not list
  // this person under the Operator app role — it never meant stops cannot be
  // scheduled for them, and when the roster fails to load entirely every card
  // is off-roster, which left the whole board read-only.
  const composer = `
    <div class="sbox">
      <input type="text" placeholder="Search machine to add a stop…" autocomplete="off"
             oninput="stopSearch(this)" onfocus="stopSearch(this)">
      <div class="sres"></div>
    </div>
    <div class="comp" style="display:none"></div>`;

  return `<div class="bd-c" data-email="${woEsc(email)}">
    <div class="bd-h"><span class="who"><b>${woEsc(driverName(email))}</b>${
      driverName(email) === email ? "" : `<span class="em">${woEsc(email)}</span>`}</span>
      <span class="pill">${mine.length} stop${mine.length !== 1 ? "s" : ""}</span></div>
    ${composer}${stops || '<p class="note" style="margin:2px 0 0;font-size:.72rem">No stops yet.</p>'}</div>`;
}

/* Who the board can schedule for when Graph is unavailable: whoever already
   holds open work, plus anyone typed in by hand this session. */
let adhocDrivers = [];
const boardPeople = () => [...new Set([
  ...drivers.map(d => d.toLowerCase()),
  ...openWork().map(w => (w.assignedTo || "").toLowerCase()).filter(Boolean),
  ...adhocDrivers,
])].filter(Boolean);
function addAdhocDriver(id){
  const el = $("#" + (id || "adhocDrv")), v = (el.value || "").trim().toLowerCase();
  if (!v || !v.includes("@")){ toast("Enter the operator's email address."); return; }
  if (!adhocDrivers.includes(v)) adhocDrivers.push(v);
  el.value = ""; render(); toast("Card added for " + v);
}

const cardEl = el => el.closest(".bd-c");
const cardEmail = el => (cardEl(el) || {}).dataset?.email || null;

/* Machine search — active machines only, name or code, capped so the list
   stays usable on a fleet of 130+. */
function stopSearch(input){
  const box = cardEl(input).querySelector(".sres");
  const q = (input.value || "").trim().toLowerCase();
  if (!q){ box.classList.remove("show"); box.innerHTML = ""; return; }
  const hits = machines.filter(m => m.active &&
      ((m.name || "").toLowerCase().includes(q) || String(m.code).includes(q))).slice(0, 8);
  box.innerHTML = hits.length
    ? hits.map(m => `<button type="button" data-code="${woEsc(m.code)}" onclick="pickMachine(this)">
        ${woEsc(m.name || m.code)}<small>${woEsc(m.code)}</small></button>`).join("")
    : '<div class="none">No active machine matches.</div>';
  box.classList.add("show");
}

function pickMachine(btn){
  const card = cardEl(btn), code = btn.dataset.code;
  const m = mByCode(code);
  card.querySelector(".sres").classList.remove("show");
  card.querySelector(".sbox input").value = "";
  const c = card.querySelector(".comp");
  c.dataset.code = code;
  c.innerHTML = `<div class="t">${woEsc(m ? m.name : code)}</div><div class="c">${woEsc(code)} · ${woEsc(boardDate)}</div>
    <div class="ticks">
      <label><input type="checkbox" class="k-service"> Service required</label>
    </div>
    <textarea class="note" placeholder="Note for the driver — shown at the top of the Work Order sheet."></textarea>
    <div class="row2">
      <select class="pri"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select>
      <button class="btn sm ghost" onclick="cancelStop(this)">Cancel</button>
      <button class="btn sm" onclick="addStop(this)">Add stop</button>
    </div>`;
  c.style.display = "block";
  c.querySelector("textarea").focus();
}
function cancelStop(btn){ const c = cardEl(btn).querySelector(".comp"); c.style.display = "none"; c.innerHTML = ""; }

async function addStop(btn){
  const card = cardEl(btn), c = card.querySelector(".comp");
  // Every stop is a visit. Service is an attribute of it, not a second order.
  const needsService = c.querySelector(".k-service").checked;
  btn.disabled = true;
  const r = await api("/api/wo/stops", {method: "POST", body: {
    machine_code:   c.dataset.code,
    assigned_to:    card.dataset.email,
    scheduled_date: boardDate,
    needs_service:  needsService,
    note:           (c.querySelector(".note").value || "").trim(),
    priority:       c.querySelector(".pri").value,
  }});
  btn.disabled = false;
  if (!r) return;
  if (r.dated === false) toast("Added — but scheduling columns are missing, so it is undated.");
  else toast(`${r.machine_name}: ${needsService ? "service stop" : "top-up"} added for ${driverName(card.dataset.email)}`);
  await reload();
}

/* Editing beats delete-and-readd: it keeps the order's history, works after a
   driver has started, and cannot orphan tasks or photos. */
const stopKind = w => w.kind === "joborder" ? "service" : w.kind === "delivery" ? "topup" : null;

function editStop(btn){
  const row = btn.closest(".stp"), box = row.querySelector(".edit");
  if (box.innerHTML){ box.innerHTML = ""; return; }
  document.querySelectorAll(".stp .edit").forEach(b => { b.innerHTML = ""; });
  const code = row.dataset.code, email = cardEmail(btn);
  const site = BOARD_SITES.find(s => s.code === code);
  if (!site) return;
  const his = site.items.filter(w => (w.assignedTo || "").toLowerCase() === email.toLowerCase());
  const day = his.map(w => w.scheduledDate).filter(Boolean)[0] || boardDate;
  // ONE FIELD PER ORDER. A site can hold a top-up note and a service diagnosis
  // at once; a single shared field would copy whichever loaded first over the
  // other. Values come from `note` (untruncated), never `desc`.
  const eds = his.filter(w => stopKind(w)).map(w => {
    const v = w.note || "";
    return `<label class="nl">${tagTxt(w.type)}</label>
      <textarea class="note" data-rid="${woEsc(String(w.rid))}" data-kind="${woEsc(stopKind(w))}"
        data-orig="${woEsc(v)}" placeholder="Note for the driver">${woEsc(v)}</textarea>`;
  }).join("");
  const svc = his.some(w => w.needsService);
  box.innerHTML = `<div class="stp-ed">
    <label class="nl"><input type="checkbox" class="svc"${svc ? " checked" : ""}> Service required</label>
    ${eds}
    <div class="r">
      <select class="drv">${(drivers.length ? drivers : boardPeople()).map(d =>
        `<option value="${woEsc(d)}"${d.toLowerCase() === (email || "").toLowerCase() ? " selected" : ""}>${woEsc(driverName(d))}</option>`).join("")}
        <option value="">— unassign —</option></select>
      <input type="date" class="dt" value="${woEsc(day)}">
    </div>
    <div class="r">
      <button class="btn sm" onclick="saveStop(this)">Save</button>
      <button class="btn sm ghost" onclick="editStop(this.closest('.stp').querySelector('.ed'))">Cancel</button>
      <button class="btn sm danger" onclick="removeStop(this)">Remove</button>
    </div></div>`;
  const ta0 = box.querySelector("textarea");
  if (ta0) ta0.focus();          // a movement-only stop has no editable note
}

async function saveStop(btn){
  const row = btn.closest(".stp"), box = row.querySelector(".edit");
  const code = row.dataset.code, email = cardEmail(btn);
  const site = BOARD_SITES.find(s => s.code === code);
  if (!site) return;
  const his = site.items.filter(w => (w.assignedTo || "").toLowerCase() === email.toLowerCase());
  const drv = box.querySelector(".drv");
  // Shared across the site's orders: the day, and who it belongs to. The note
  // is per order and only travels when that specific field was edited.
  const common = {scheduled_date: box.querySelector(".dt").value || null};
  if (drv.options.length > 1 || drv.value) common.assigned_to = drv.value;
  const svcBox = box.querySelector(".svc");
  btn.disabled = true;
  let ok = 0, failed = 0, skipped = 0;
  for (const w of his){
    const k = stopKind(w);
    if (!k || !w.rid){ skipped++; continue; }
    const body = Object.assign({}, common);
    // Only a delivery order carries the service flag. Applying it to a legacy
    // Tech Support job order at the same site would be meaningless.
    if (svcBox && k === "topup") body.needs_service = svcBox.checked;
    const ta = box.querySelector(`textarea[data-rid="${w.rid}"][data-kind="${k}"]`);
    if (ta){
      const typed = (ta.value || "").trim();
      if (typed !== (ta.dataset.orig || "").trim()) body.note = typed;
    }
    const r = await api(`/api/wo/stops/${k}/${w.rid}`, {method: "PATCH", body});
    if (r) ok++; else failed++;
  }
  btn.disabled = false;
  await reload();
  if (failed) return;                      // leave the server's error on screen
  toast(`${site.name}: ${ok} order(s) updated` + (skipped ? ` · ${skipped} not editable here` : ""));
}

/* Remove cancels the orders, but only while untouched — the server refuses
   anything a driver has opened on a Work Order sheet. */
async function removeStop(btn){
  const row = btn.closest(".stp"), code = row.dataset.code, email = cardEmail(btn);
  const site = BOARD_SITES.find(s => s.code === code);
  if (!site || !email) return;
  const his = site.items.filter(w => (w.assignedTo || "").toLowerCase() === email.toLowerCase());
  if (!confirm(`Remove ${site.name} from ${driverName(email)}? ${his.length} order(s) will be cancelled.`)) return;
  let ok = 0, kept = 0;
  for (const w of his){
    const kind = stopKind(w);
    if (!kind || !w.rid){ kept++; continue; }
    const r = await api(`/api/wo/stops/${kind}/${w.rid}`, {method: "DELETE"});
    if (r) ok++; else kept++;
  }
  await reload();
  toast(`${site.name}: ${ok} order(s) removed` + (kept ? ` · ${kept} kept (already worked or not removable)` : ""));
}

/* One site -> one driver, for the Unassigned list's Assign control. */
async function assignSite(code, email, verb, onlyFrom){
  const lc = onlyFrom ? onlyFrom.toLowerCase() : null;
  const items = openWork().filter(w => w.machine === code &&
    (!lc || (w.assignedTo || "").toLowerCase() === lc));
  let ok = 0, failed = 0, skipped = 0;
  for (const w of items){
    let path = null;
    if (w.rid){
      if (w.kind === "joborder")      path = `/api/wo/joborders/${w.rid}/assign`;
      else if (w.kind === "delivery") path = `/api/wo/deliveryorders/${w.rid}/assign`;
      else if (w.kind === "movement") path = `/api/wo/movementorders/${w.rid}/assign`;
    }
    if (!path){ skipped++; continue; }
    const r = await api(path, {method: "POST",
      body: {assigned_to: email, scheduled_date: email ? boardDate : null}});
    if (r) ok++; else failed++;
  }
  const bits = [`${ok} ${verb}`];
  if (failed)  bits.push(`${failed} failed`);
  if (skipped) bits.push(`${skipped} skipped (raise a job order first)`);
  return `${code}: ` + bits.join(" · ");
}

async function autoPlan(){
  if(!drivers.length){toast("No technicians found to assign — configure the Technician lookup.");return;}
  // Round-robin by SITE, not by work item. Assigning item-by-item would split a
  // machine across two drivers, which the board cannot represent and which makes
  // the per-driver clear button destructive.
  // Only sites where EVERY item is unassigned. A site that is partly someone
  // else's would otherwise be moved wholesale with no warning — boardAssign
  // asks before doing that; auto-plan has no way to ask per site.
  const all=buildSites().filter(s=>s.items.some(w=>!w.assignedTo));
  const todo=all.filter(s=>s.items.every(w=>!w.assignedTo));
  const partial=all.length-todo.length;
  if(!todo.length){toast(partial?`Nothing fully unassigned — ${partial} site(s) are part-assigned; edit them individually.`
                                :"Nothing to auto-plan — every site already has a driver.");return;}
  if(!confirm(`Assign ${todo.length} fully unassigned site(s) round-robin across ${drivers.length} driver(s)?`
    +(partial?`\n\n${partial} part-assigned site(s) will be left alone.`:"")))return;
  let ok=0,bad=0;
  for(let i=0;i<todo.length;i++){
    const s=await assignSite(todo[i].code, drivers[i%drivers.length], "assigned");
    if(/failed/.test(s)){bad++;} else {ok++;}
  }
  await reload();
  toast(`Auto-plan — ${ok} site(s) assigned`+(bad?` · ${bad} had failures, check the work list`:"")
        +(partial?` · ${partial} part-assigned skipped`:""));}

async function loadSalesLocations(){
  try{
    const names=await(await fetch("/api/location-names")).json();
    if(!Array.isArray(names))return;

    while(sel.options.length>1)sel.remove(1);

async function searchSalesSummary(){
  const s0=$("#sal_s0"),s1=$("#sal_s1"),e0=$("#sal_e0"),e1=$("#sal_e1"),loc=$("#sal_loc");
  if(!s0||!s0.value||!e0||!e0.value){setSalesStatus("Enter a start and end date.","error");return;}
  const start=`${s0.value} ${s1.value}`,end=`${e0.value} ${e1.value}`;
  const btn=$("#sal_btn");btn.disabled=true;
  setSalesStatus("Querying…","loading");
  $("#sal_results").style.display="none";$("#sal_txns").style.display="none";
  try{
    let url=`/api/dispenses?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
    if(loc&&loc.value)url+=`&location=${encodeURIComponent(loc.value)}`;
    const d=await(await fetch(url)).json();
    if(d.error){setSalesStatus("Error: "+d.error,"error");return;}
    setSalesStatus("","");renderSalesSummary(d.results,d.total);
  }catch(e){setSalesStatus("Could not reach the server.","error");}
  finally{btn.disabled=false;}
}

function renderSalesSummary(results,total){
  $("#sal_total").textContent=total.toLocaleString();
  $("#sal_skus").textContent=results.length;
  $("#sal_foot").textContent=total.toLocaleString();
  const max=results.length>0?results[0].count:1;
  $("#sal_tbody").innerHTML=results.length
    ?results.map((r,i)=>{const pct=total>0?((r.count/total)*100).toFixed(1):"0.0";const bar=((r.count/max)*100).toFixed(1);
      return `<tr><td>${i+1}</td><td>${esc(r.sku)}</td><td style="color:var(--mut);font-size:.78rem">${r.code}</td><td class="right">${r.count.toLocaleString()}</td><td class="right">${pct}%</td><td><div class="bar-bg"><div class="bar-fill" style="width:${bar}%"></div></div></td></tr>`;}).join("")
    :`<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:28px">No dispenses found.</td></tr>`;
  $("#sal_results").style.display="block";
}

function renderSalesTxns(results,capped){

    ?results.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${esc(r.item)}</td><td>${esc(r.machine)}</td></tr>`).join("")

function exportSalesCSV(view){
  const s0=$("#sal_s0"),e0=$("#sal_e0"),loc=$("#sal_loc");
  const start=s0?s0.value:"",end=e0?e0.value:"";
  const locLabel=loc?loc.options[loc.selectedIndex]?.text||"all":"all";
  const csvEsc=v=>{const s=String(v??"");return(s.includes(",")||s.includes('"')||s.includes("\n"))?`"${s.replace(/"/g,'""')}"`:`${s}`;};
  let rows,filename;
  if(view==="summary"){
    rows=[["#","SKU","Item Code","Count","% of Total"]];
    document.querySelectorAll("#sal_tbody tr").forEach(tr=>{const tds=tr.querySelectorAll("td");
      if(tds.length>=5)rows.push([tds[0].textContent,tds[1].textContent,tds[2].textContent,tds[3].textContent,tds[4].textContent]);});
    filename=`sales_summary_${locLabel}_${start}_to_${end}.csv`;
  }else{
    rows=[["Date","Time","Item Dispensed","Machine"]];
    document.querySelectorAll("#sal_tbodytxn tr").forEach(tr=>{const tds=tr.querySelectorAll("td");
      if(tds.length>=4)rows.push([tds[0].textContent,tds[1].textContent,tds[2].textContent,tds[3].textContent]);});
    filename=`transactions_${locLabel}_${start}_to_${end}.csv`;
  }
  const csv=rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename.replace(/[^a-z0-9._\-]/gi,"_");
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function esc(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

/* boot */
async function boot(){
  // Honour a role the user already chose in the main dashboard; only write the
  // cookie when there isn't a valid one, so /alpha never silently switches them.
  const ck=readRoleCookie();
  state.role = (MYROLES.includes(ck)&&ROLE_NAV[ck] ? ck : MYROLES.find(r=>ROLE_NAV[r])) || state.role;
  if(ck!==state.role) syncRoleCookie();
  buildRolePicker();state.area=ROLE_HOME[state.role];
  try{
    const res=await fetch("/alpha/api/bootstrap");const d=await res.json();
    machines=(d.machines||[]).map(m=>({vendsSince:null,...m}));
    work=d.work||[];
    state.salesVends=d.health?d.health.salesVends:null;
    if(!machines.length){demoSeed();setBanner({live:false,reason:"no rows returned"});}
    else setBanner(d.health);
  }catch(e){demoSeed();setBanner({live:false,reason:String(e)});}
  try{  // assignment targets — managers only; non-managers just get free-text
    const t=await(await fetch("/api/wo/technicians")).json();
    techs=(t&&t.technicians||[]).map(u=>({email:(u.email||u.mail||u.userPrincipalName||"").toLowerCase(),name:u.name||u.displayName||null})).filter(u=>u.email);
    drivers=techEmails();
  }catch(e){techs=[];drivers=[];}
  render();
}
