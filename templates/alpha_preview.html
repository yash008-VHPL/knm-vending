<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNM Ops — Streamlined (alpha)</title>
<style>
  :root{
    --blue:#1a56db;--blue-d:#163fa8;--ink:#1f2933;--mut:#6b7280;--line:#e5e7eb;
    --bg:#f0f4f8;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#b91c1c;
    --green-bg:#dcfce7;--amber-bg:#fef3c7;--red-bg:#fee2e2;--chip:#eef2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:var(--blue);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header .brand{font-weight:800}
  header .brand small{display:block;font-weight:500;opacity:.8;font-size:.7rem}
  .rolepick{display:flex;align-items:center;gap:8px;font-size:.78rem;flex-wrap:wrap}
  .rolepick select{border-radius:7px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;padding:5px 9px;font-weight:600}
  .rolepick select option{color:#111}
  .banner{padding:7px 18px;font-size:.78rem;font-weight:600;display:flex;gap:8px;align-items:center}
  .banner.live{background:var(--green-bg);color:#14532d}
  .banner.demo{background:var(--amber-bg);color:#7c2d12}
  .banner b{font-weight:800}
  nav.tabs{display:flex;gap:4px;background:#fafbff;border-bottom:1px solid var(--line);padding:6px 12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-size:.9rem;font-weight:600;color:var(--mut);cursor:pointer;border-radius:7px 7px 0 0}
  nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
  .screen-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .screen-h h2{font-size:1.2rem;font-weight:800}
  .screen-h .crumb{font-size:.74rem;color:var(--mut)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#eef2ff;color:var(--blue)}
  .btn.sm{padding:5px 10px;font-size:.74rem}
  .btn.danger{background:#fee2e2;color:#b91c1c}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .subnav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .subnav button{font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:20px;background:#f1f5f9;color:#475569;border:none;cursor:pointer}
  .subnav button.on{background:var(--blue);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fafbff}
  .kpi b{font-size:1.5rem;display:block;line-height:1.1}
  .kpi small{color:var(--mut)}
  .rows{display:grid;gap:8px}
  .row{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .row .grow{flex:1;min-width:0}
  .row .grow b{display:block}
  .row .meta{font-size:.76rem;color:var(--mut)}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
  .tag{font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .tag.svc{background:#fee2e2;color:#b91c1c}.tag.del{background:#dbeafe;color:#1d4ed8}
  .tag.mov{background:#ede9fe;color:#6d28d9}.tag.done{background:#dcfce7;color:#15803d}
  .tag.new{background:#fef3c7;color:#92400e}.tag.assigned{background:#e0e7ff;color:#3730a3}
  label{display:block;font-size:.74rem;font-weight:700;color:var(--mut);margin:0 0 4px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;font-family:inherit;background:#fff}
  textarea{min-height:64px;resize:vertical}
  .field{margin-bottom:11px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .empty{color:var(--mut);font-style:italic;text-align:center;padding:28px 0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:.84rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
  .drawer-bg.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:#fff;box-shadow:-4px 0 18px rgba(0,0,0,.18);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .25s;z-index:31}
  .drawer.show{transform:translateX(0)}
  .drawer h3{font-size:1.05rem;margin-bottom:4px}
  .drawer .x{position:absolute;top:14px;right:16px;cursor:pointer;font-size:1.3rem;color:var(--mut);background:none;border:none}
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:grid;gap:10px}
  .timeline div{font-size:.8rem}.timeline b{font-size:.7rem;color:var(--blue);display:block}
  .pill{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--blue)}
  .note{font-size:.78rem;color:var(--mut);margin-top:10px}
  .legacy-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:9px 12px;font-size:.78rem;margin-bottom:14px}
  /* ── Sales search ── */
  .sales-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .sales-controls .field{flex:1;min-width:130px;margin-bottom:0}
  .datetime-row{display:flex;gap:5px}
  .datetime-row input{flex:1}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
  .view-toggle button{border:none;background:#fff;padding:7px 11px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--mut)}
  .view-toggle button.on{background:var(--blue);color:#fff}
  .sales-summary-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .sales-stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fafbff}
  .sales-stat .val{font-size:1.6rem;font-weight:700;color:var(--blue);line-height:1}
  .sales-stat small{color:var(--mut)}
  .bar-bg{background:#e5e7eb;border-radius:4px;height:8px;overflow:hidden;min-width:50px}
  .bar-fill{background:var(--blue);height:100%;border-radius:4px}
  .sales-table{width:100%;border-collapse:collapse;font-size:.83rem}
  .sales-table th{text-align:left;padding:7px 9px;border-bottom:2px solid var(--line);font-weight:700;color:var(--mut);font-size:.73rem}
  .sales-table td{padding:6px 9px;border-bottom:1px solid var(--line)}
  .sales-table .right{text-align:right}
  .sales-status{padding:7px 10px;border-radius:8px;font-size:.79rem;font-weight:600;margin-bottom:10px}
  .sales-status.error{background:#fee2e2;color:#b91c1c}
  .sales-status.loading{background:#dbeafe;color:#1e40af}
  .cap-note{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:7px 11px;font-size:.78rem;margin-bottom:10px}
  .btn.success{background:#16a34a;color:#fff}
  .btn.success:hover{background:#15803d}
</style>
</head>
<body>

<header>
  <div class="brand">KNM Ops <small>streamlined — alpha (live actions)</small></div>
  <div class="rolepick">
    <span>Signed in as</span>
    <select id="rolesel"></select>
  </div>
</header>
<div class="banner demo" id="banner">Loading…</div>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="drawer-bg" id="drawerbg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"><button class="x" onclick="closeDrawer()">×</button><div id="drawerc"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Streamlined UI (alpha) — reads from /alpha/api/bootstrap and WRITES through the
   existing production work-order API (/api/wo/*): same validation, role checks,
   activity log, top-up sync and movement location-cutover as the main dashboard. */
const ME = {{ (username or "") | tojson }};
const MYROLES = {{ (roles or []) | tojson }};

const AREAS={fleet:"Fleet",machines:"Machines",service:"Service",plan:"Plan",admin:"Admin"};
const ROLE_NAV={
  operator:["service","machines"], customer_service:["service","machines"],
  field_manager:["service","plan","fleet","machines"], dispatch:["plan","fleet","machines","service"],
  sales:["fleet","service"], admin:["service","plan","fleet","machines","admin"]};
const ROLE_HOME={operator:"service",customer_service:"service",field_manager:"service",dispatch:"plan",sales:"fleet",admin:"service"};
const ROLE_LABEL={operator:"Operator (driver)",customer_service:"Customer Service",field_manager:"Field Manager",dispatch:"Dispatch",sales:"Sales",admin:"Admin"};

let state={role:"customer_service",area:"service",sub:{},seq:{REP:9000},salesVends:null};
let machines=[], work=[], live=false;
let techs=[];                    // [{email,name}] from /api/wo/technicians
const techEmails=()=>techs.map(t=>t.email).filter(Boolean);
let drivers=[];                  // assignment targets (emails) — filled at boot

async function api(path,opts={}){
  try{
    const res=await fetch(path,{method:opts.method||"GET",
      headers:{"Content-Type":"application/json"},
      body:opts.body!==undefined?JSON.stringify(opts.body):undefined});
    let d=null; try{d=await res.json();}catch(_){}
    if(!res.ok||(d&&d.error)){toast((d&&d.error)||("Request failed ("+res.status+")"));return null;}
    return d||{ok:true};
  }catch(e){toast("Network error — "+e);return null;}
}
async function reload(){
  const d=await api("/alpha/api/bootstrap"); if(!d)return;
  machines=(d.machines||[]).map(m=>({vendsSince:null,...m}));
  work=d.work||[]; state.salesVends=d.health?d.health.salesVends:null;
  setBanner(d.health); render();
}
const kb=[{id:"KB-12",sym:"No dispense after coin",root:"Jammed dispense motor",fix:"Clear jam, cycle motor, test 3 vends"},
          {id:"KB-07",sym:"Card reader offline",root:"Loose data ribbon",fix:"Reseat ribbon, reboot reader"}];
const driverName=e=>{if(!e)return "unassigned";const t=techs.find(x=>(x.email||"").toLowerCase()===String(e).toLowerCase());return t&&t.name?t.name:e;};

const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}
const tagFor=t=>({service:"svc",delivery:"del",movement:"mov"}[t]||"svc");
const tagTxt=t=>(t||"").toUpperCase();
const mByCode=c=>machines.find(m=>m.code===c);
const wName=w=>{const m=mByCode(w.machine);return m?m.name:(w.machineName||w.machine);};
function statusTag(w){return w.status==="new"?'<span class="tag new">NEW</span>':w.status==="assigned"?'<span class="tag assigned">ASSIGNED</span>':'<span class="tag done">DONE</span>';}

function buildRolePicker(){
  const sel=$("#rolesel");sel.innerHTML="";
  Object.keys(ROLE_NAV).forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=ROLE_LABEL[r];if(r===state.role)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{state.role=sel.value;state.area=ROLE_HOME[state.role];state.sub={};render();toast("Switched to "+ROLE_LABEL[state.role]);};
}
function buildTabs(){const nav=$("#tabs");nav.innerHTML="";
  ROLE_NAV[state.role].forEach(a=>{const b=document.createElement("button");b.textContent=AREAS[a];b.className=(a===state.area?"on":"");b.onclick=()=>{state.area=a;render();};nav.appendChild(b);});}
function render(){buildTabs();const m=$("#main");
  m.innerHTML=({service:renderService,machines:renderMachines,fleet:renderFleet,plan:renderPlan,admin:renderAdmin}[state.area]||(()=>""))();
  document.querySelectorAll("[data-sub]").forEach(b=>{b.onclick=()=>{state.sub[state.area]=b.dataset.sub;render();};});
  if(state.area==="fleet"&&subActive("fleet","status")==="sales") initSalesTab();
}
const subActive=(a,d)=>state.sub[a]||d;

/* SERVICE */
function renderService(){const r=state.role;let modes;
  if(r==="operator")modes=[["myjobs","My Jobs"],["kb","Knowledge Base"]];
  else if(r==="field_manager"||r==="admin")modes=[["triage","Triage board"],["kb","Knowledge Base"]];
  else modes=[["report","Report a problem"],["mine","My reports"]];
  const cur=subActive("service",modes[0][0]);
  const body=({report:svcReport,mine:svcMine,triage:svcTriage,myjobs:svcMyJobs,kb:svcKB}[cur]||(()=>""))();
  return `<div class="screen-h"><div><h2>Service</h2><div class="crumb">Report · Triage · Do — one work record across roles</div></div></div>
   <div class="legacy-note">Replaces Fault Report + Tech Support + Work Orders + Manage KB; retires the legacy Work Orders app.</div>
   <div class="subnav">${modes.map(([k,l])=>`<button data-sub="${k}" class="${k===cur?'on':''}">${l}</button>`).join("")}</div>${body}`;}
function svcReport(){const opts=machines.filter(m=>m.active).map(m=>`<option value="${m.code}">${m.name}</option>`).join("");
  return `<div class="card" style="max-width:560px">
    <div class="field"><label>Machine</label><select id="rep_m">${opts}</select></div>
    <div class="field"><label>What's wrong?</label><textarea id="rep_d" placeholder="Describe the fault…"></textarea></div>
    <div class="grid2"><div class="field"><label>Priority</label><select id="rep_p"><option>normal</option><option>high</option><option>low</option></select></div>
      <div class="field"><label>Photo (preview)</label><input value="📷 attach from phone" disabled></div></div>
    <button class="btn" onclick="submitReport()">Submit report</button>
    <p class="note">Live — submits a real fault report (complaint) into the work-order system and lands on the Triage board.</p></div>`;}
async function submitReport(){const code=$("#rep_m").value,desc=($("#rep_d").value||"").trim(),p=$("#rep_p").value;
  if(!desc){toast("Describe the fault first.");return;}
  if(!live){toast("Demo mode — backend unreachable, nothing saved.");return;}
  const m=mByCode(code);
  const r=await api("/api/wo/complaints",{method:"POST",body:{description:desc,machine_code:code,
    machine_name:m?m.name:null,perceived_urgency:({low:0,normal:1,high:2}[p]??1),source:"self"}});
  if(!r)return;
  state.sub.service="mine";await reload();toast("Report submitted"+(r.display_id?" — "+r.display_id:""));}
function svcMine(){return listWork(work.filter(w=>w.status!=="done"),"No open reports.");}
function svcTriage(){const news=work.filter(w=>w.status==="new"),prog=work.filter(w=>w.status==="assigned");
  return `<div class="kpis"><div class="kpi"><b>${news.length}</b><small>new</small></div><div class="kpi"><b>${prog.length}</b><small>in progress</small></div><div class="kpi"><b>${work.filter(w=>w.status==="done").length}</b><small>done</small></div></div>
    <h3 style="margin:4px 0 8px;font-size:.95rem">New — needs triage &amp; assignment</h3>
    ${news.length?`<div class="rows">${news.map(triageRow).join("")}</div>`:'<p class="empty">Inbox clear 🎉</p>'}
    <h3 style="margin:18px 0 8px;font-size:.95rem">In progress</h3>${prog.length?listWork(prog):'<p class="empty">Nothing assigned.</p>'}`;}
function triageRow(w){const m=mByCode(w.machine);
  return `<div class="row"><span class="dot ${m?m.status:'g'}"></span><div class="grow"><b>${wName(w)} — ${w.desc}</b>
    <div class="meta">${w.id} · ${w.source} · priority ${w.priority}</div></div><span class="tag ${tagFor(w.type)}">${tagTxt(w.type)}</span>
    ${w.kind==="movement"?`<span class="pill">assign via Movements tab</span>`
      :drivers.length?`<select id="as_${cssId(w.id)}" class="btn sm ghost" style="width:auto">${drivers.map(d=>`<option value="${d}">${driverName(d)}</option>`).join("")}</select>
    <button class="btn sm" onclick="assign('${w.id}')">Assign</button>`
      :`<input id="as_${cssId(w.id)}" placeholder="operator@email" style="width:170px">
    <button class="btn sm" onclick="assign('${w.id}')">Assign</button>`}</div>`;}
async function assign(id){const w=work.find(x=>x.id===id);const d=($("#as_"+cssId(id)).value||"").trim();
  if(!d){toast("Pick or type an assignee first.");return;}
  if(!w.rid){toast("Demo row — not writable.");return;}
  let r=null;
  if(w.kind==="joborder")      r=await api(`/api/wo/joborders/${w.rid}/assign`,{method:"POST",body:{assigned_to:d}});
  else if(w.kind==="delivery") r=await api(`/api/wo/deliveryorders/${w.rid}/assign`,{method:"POST",body:{assigned_to:d}});
  else if(w.kind==="complaint")r=await api("/api/wo/joborders",{method:"POST",body:{complaint_id:w.rid,assigned_to:d,
    diagnosis:w.desc,machine_code:w.machine!=="?"?w.machine:null,machine_name:w.machineName||undefined}});
  else{toast("Assign movements from the main dashboard's Movements tab.");return;}
  if(!r)return; await reload(); toast(w.id+" assigned to "+driverName(d));}
function svcMyJobs(){const me=(ME||"").toLowerCase();const mine=work.filter(w=>(w.assignedTo||"").toLowerCase()===me&&w.status==="assigned");
  return `<p class="note" style="margin:0 0 10px">Stops assigned to <b>${ME||"you"}</b>. Service, delivery &amp; movement in one list.</p>
   ${mine.length?`<div class="rows">${mine.map(jobRow).join("")}</div>`:'<p class="empty">No open stops assigned to you.</p>'}`;}
function jobRow(w){const m=mByCode(w.machine);
  return `<div class="row"><span class="dot ${m?m.status:'g'}"></span><div class="grow"><b>${wName(w)}</b><div class="meta">${w.desc} · ${w.id}</div></div>
    <span class="tag ${tagFor(w.type)}">${tagTxt(w.type)}</span><button class="btn sm ghost" onclick="openJob('${w.id}')">Open</button></div>`;}
function openJob(id){const w=work.find(x=>x.id===id);const m=mByCode(w.machine);
  const kbLink=w.type==="service"?`<div class="card" style="background:#f8fafc"><b>KB-12</b> — No dispense after coin<div class="meta">Clear jam, cycle motor, test 3 vends</div></div>`:"";
  const refill=w.kind==="delivery"?`<div class="field"><label>Received by — typed signature (required)</label><input id="job_recipient" placeholder="Recipient name"></div>`:"";
  const hint=w.kind==="joborder"?"Completing marks the job <b>done — pending manager review</b> (manager closes it)."
           :w.kind==="delivery"?"Completing signs the delivery and syncs the top-up to vending data."
           :w.kind==="movement"?"Completing applies the machine's <b>location change</b> exactly like the Movements tab."
           :"Complaints close via manager review once their job order is done.";
  drawer(`<h3>${wName(w)}</h3><span class="pill">${tagTxt(w.type)}</span> <span class="pill">${w.id}</span><p class="note">${w.desc}</p>${kbLink}${refill}
    ${w.kind!=="complaint"?`<button class="btn" onclick="completeJob('${w.id}')">Complete &amp; sign visit</button>`:""}
    <p class="note">${hint}</p>`);}
async function completeJob(id){const w=work.find(x=>x.id===id);
  if(!w.rid){toast("Demo row — not writable.");return;}
  if(w.kind==="joborder"){
    const r=await api(`/api/wo/joborders/${w.rid}/status`,{method:"POST",body:{status_code:2}});
    if(!r)return; closeDrawer(); await reload(); toast(w.id+" done — pending manager review");
  }else if(w.kind==="delivery"){
    const rec=(($("#job_recipient")||{}).value||"").trim();
    if(!rec){toast("Enter the recipient name (typed signature).");return;}
    const det=await api(`/api/wo/deliveryorders/${w.rid}`); if(!det)return;
    const q=(det.items||[]).map(i=>i.quantity??0); while(q.length<8)q.push(0);
    const p=await api(`/api/wo/deliveryorders/${w.rid}`,{method:"PATCH",body:{quantities:q.slice(0,8),recipient_name:rec}});
    if(!p)return;
    const r=await api(`/api/wo/deliveryorders/${w.rid}/complete`,{method:"POST",body:{}});
    if(!r)return; closeDrawer(); await reload(); toast(w.id+" completed"+(r.topup_note?" — "+r.topup_note:""));
  }else if(w.kind==="movement"){
    const r=await api(`/api/wo/movementorders/${w.rid}/complete`,{method:"POST",body:{}});
    if(!r)return; closeDrawer(); await reload(); toast(w.id+" completed — location updated");
  }else{toast("Complaints close via manager review once their job order is done.");}}
function svcKB(){return `<div class="rows">${kb.map(k=>`<div class="row"><div class="grow"><b>${k.id} — ${k.sym}</b><div class="meta">Root: ${k.root} · Fix: ${k.fix}</div></div>${(state.role==="field_manager"||state.role==="admin")?'<button class="btn sm ghost">Edit</button>':''}</div>`).join("")}</div><p class="note">CAR-format KB, inline from any job (was the Manage KB tab). Demo entries.</p>`;}
function listWork(arr,empty){if(!arr.length)return `<p class="empty">${empty||"Nothing here."}</p>`;
  return `<div class="rows">${arr.map(w=>{const m=mByCode(w.machine);return `<div class="row"><span class="dot ${m?m.status:'g'}"></span>
    <div class="grow"><b>${wName(w)} — ${w.desc}</b><div class="meta">${w.id} · ${driverName(w.assignedTo)} · ${w.source}</div></div>
    <span class="tag ${tagFor(w.type)}">${tagTxt(w.type)}</span>${statusTag(w)}</div>`;}).join("")}</div>`;}

/* MACHINES */
function machinesFor(){const cur=subActive("machines","active");const q=(state.mq||"").trim().toLowerCase();
  return machines.filter(m=>(cur==="active"?m.active:!m.active) &&
    (!q || (m.name||"").toLowerCase().includes(q) || (m.code||"").toLowerCase().includes(q)));}
function machineRowsHtml(){const canEdit=["admin","dispatch","field_manager"].includes(state.role);const list=machinesFor();
  if(!list.length) return '<p class="empty">No machines match your search.</p>';
  return list.map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${m.name}</b>

function renderMachineList(){const el=document.getElementById("mList");if(el)el.innerHTML=machineRowsHtml();

function renderMachines(){const cur=subActive("machines","active");const canEdit=["admin","dispatch","field_manager"].includes(state.role);

function openMachine(code){const m=mByCode(code);const wos=work.filter(w=>w.machine===code);

function openAddMachine(){

async function submitAddMachine(){

/* FLEET */
function renderFleet(){const cur=subActive("fleet","status");
  const A=machines.filter(m=>m.active);const g=A.filter(m=>m.status==="g").length,y=A.filter(m=>m.status==="y").length,r=A.filter(m=>m.status==="r").length;

  else if(cur==="events")body=`<div class="rows">${A.filter(m=>m.status!=="g").slice(0,12).map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${m.name}</b><div class="meta">${m.status==='r'?'silent past threshold':'recent error/exception'}</div></div></div>`).join("")||'<p class="empty">No active alerts.</p>'}</div><p class="note">Derived from heartbeat (was Messages tab).</p>`;
  else if(cur==="refill")body=`<div class="rows">${A.map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${m.name}</b><div class="meta">${m.vendsSince==null?'vends since refill: —':m.vendsSince+' vends since refill'} · last ${m.lastRefill}</div></div></div>`).join("")}</div><p class="note">Read-only refill status so Sales keeps top-up visibility. Logging happens in Plan / My Jobs.</p>`;

    <div class="rows">${A.map(m=>`<div class="row"><span class="dot ${m.status}"></span><div class="grow"><b>${m.name}</b><div class="meta">${m.status==='r'?'silent — needs attention':m.status==='y'?'warning':'online'}</div></div>${m.status!=='g'?`<button class="btn sm ghost" onclick="fleetReport('${m.code}')">Report fault</button>`:''}</div>`).join("")}</div>

function renderPlan(){const open=work.filter(w=>w.status!=="done");const un=open.filter(w=>!w.assignedTo);
  return `<div class="screen-h"><div><h2>Plan — today</h2><div class="crumb">Route &amp; schedule — Dispatch + Topups + Movements</div></div><button class="btn" onclick="autoPlan()">Auto-plan routes</button></div>
    <div class="kpis"><div class="kpi"><b>${open.filter(w=>w.type==='delivery').length}</b><small>deliveries</small></div><div class="kpi"><b>${open.filter(w=>w.type==='service').length}</b><small>service</small></div>
      <div class="kpi"><b>${open.filter(w=>w.type==='movement').length}</b><small>movements</small></div><div class="kpi"><b>${un.length}</b><small>unassigned</small></div></div>
    <h3 style="font-size:.95rem;margin:4px 0 8px">Drivers &amp; load</h3>
    <div class="rows">${drivers.map(d=>{const load=open.filter(w=>w.assignedTo===d);return `<div class="row"><div class="grow"><b>${driverName(d)}</b><div class="meta">${load.length} stop(s): ${load.map(w=>w.machine).join(", ")||"—"}</div></div><span class="pill">${load.length} stop${load.length!==1?'s':''}</span></div>`;}).join("")}</div>
    <h3 style="font-size:.95rem;margin:18px 0 8px">Unassigned work</h3>${un.length?`<div class="rows">${un.map(triageRow).join("")}</div>`:'<p class="empty">All open work is assigned.</p>'}
    <p class="note">Live — assignments write to the work-order system. A refill routes here and closes as a delivery stop, so the Topups tab disappears.</p>`;}
async function autoPlan(){
  const un=work.filter(w=>w.status!=="done"&&!w.assignedTo&&w.rid&&(w.kind==="joborder"||w.kind==="delivery"));
  if(!un.length){toast("Nothing auto-plannable (job orders & deliveries only).");return;}
  if(!drivers.length){toast("No technicians found to assign — configure the Technician lookup.");return;}
  let n=0;
  for(let i=0;i<un.length;i++){const w=un[i];const d=drivers[i%drivers.length];
    const path=w.kind==="joborder"?`/api/wo/joborders/${w.rid}/assign`:`/api/wo/deliveryorders/${w.rid}/assign`;
    const r=await api(path,{method:"POST",body:{assigned_to:d}}); if(r)n++;}
  await reload(); toast("Auto-planned "+n+" of "+un.length+" stop(s)");}

/* ── SALES SEARCH ── */
let _salesView='summary';

function renderSalesUI(){
  return `<div class="card">
    <div class="sales-controls">
      <div class="field"><label>Location</label><select id="sal_loc"><option value="">All Locations</option></select></div>
      <div class="field"><label>Start</label><div class="datetime-row"><input type="date" id="sal_s0"><input type="time" id="sal_s1" value="00:00" style="max-width:90px"></div></div>
      <div class="field"><label>End</label><div class="datetime-row"><input type="date" id="sal_e0"><input type="time" id="sal_e1" value="23:59" style="max-width:90px"></div></div>
      <div class="view-toggle"><button id="sal_vsum" class="on" onclick="setSalesView('summary')">Summary</button><button id="sal_vtxn" onclick="setSalesView('transactions')">Transactions</button></div>
      <button class="btn" id="sal_btn" onclick="runSalesSearch()">Search</button>
    </div>
    <div id="sal_status" style="display:none"></div>
  </div>
  <div id="sal_results" style="display:none"><div class="card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm success" onclick="exportSalesCSV('summary')">⬇ Export CSV</button></div>
    <div class="sales-summary-row">
      <div class="sales-stat"><div class="val" id="sal_total">0</div><small>Total Dispenses</small></div>
      <div class="sales-stat"><div class="val" id="sal_skus">0</div><small>Unique SKUs</small></div>
    </div>
    <table class="sales-table">
      <thead><tr><th style="width:36px">#</th><th>SKU</th><th style="width:80px;color:#9ca3af;font-weight:500">Code</th><th class="right" style="width:90px">Count</th><th class="right" style="width:80px">%</th><th style="min-width:80px"></th></tr></thead>
      <tbody id="sal_tbody"></tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="right" id="sal_foot"></td><td class="right">100%</td><td></td></tr></tfoot>
    </table>
  </div></div>
  <div id="sal_txns" style="display:none"><div class="card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm success" onclick="exportSalesCSV('transactions')">⬇ Export CSV</button></div>
    <div id="sal_cap" class="cap-note" style="display:none">⚠️ Results capped at 2,000 rows. Narrow your date range.</div>
    <div id="sal_cnt" style="font-size:.78rem;color:var(--mut);margin-bottom:10px"></div>
    <table class="sales-table">
      <thead><tr><th style="width:100px">Date</th><th style="width:80px">Time</th><th>Item</th><th>Machine</th></tr></thead>
      <tbody id="sal_tbodytxn"></tbody>
    </table>
  </div></div>`;
}

function initSalesTab(){
  const now=new Date(),s=new Date(now);s.setDate(now.getDate()-7);
  const fmt=d=>d.toISOString().slice(0,10);
  const e0=$("#sal_e0"),s0=$("#sal_s0");
  if(e0&&!e0.value)e0.value=fmt(now);
  if(s0&&!s0.value)s0.value=fmt(s);
  loadSalesLocations();
}

async function loadSalesLocations(){
  try{
    const names=await(await fetch("/api/location-names")).json();
    if(!Array.isArray(names))return;
    const sel=$("#sal_loc");if(!sel)return;
    while(sel.options.length>1)sel.remove(1);
    names.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o);});
  }catch(e){}
}

function setSalesView(v){
  _salesView=v;
  const sum=$("#sal_vsum"),txn=$("#sal_vtxn");
  if(sum)sum.classList.toggle("on",v==="summary");
  if(txn)txn.classList.toggle("on",v==="transactions");
}

function runSalesSearch(){
  if(_salesView==="transactions")searchSalesTxns();else searchSalesSummary();
}

async function searchSalesSummary(){
  const s0=$("#sal_s0"),s1=$("#sal_s1"),e0=$("#sal_e0"),e1=$("#sal_e1"),loc=$("#sal_loc");
  if(!s0||!s0.value||!e0||!e0.value){setSalesStatus("Enter a start and end date.","error");return;}
  const start=`${s0.value} ${s1.value}`,end=`${e0.value} ${e1.value}`;
  const btn=$("#sal_btn");btn.disabled=true;
  setSalesStatus("Querying…","loading");
  $("#sal_results").style.display="none";$("#sal_txns").style.display="none";
  try{
    let url=`/api/dispenses?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
    if(loc&&loc.value)url+=`&location=${encodeURIComponent(loc.value)}`;
    const d=await(await fetch(url)).json();
    if(d.error){setSalesStatus("Error: "+d.error,"error");return;}
    setSalesStatus("","");renderSalesSummary(d.results,d.total);
  }catch(e){setSalesStatus("Could not reach the server.","error");}
  finally{btn.disabled=false;}
}

function renderSalesSummary(results,total){
  $("#sal_total").textContent=total.toLocaleString();
  $("#sal_skus").textContent=results.length;
  $("#sal_foot").textContent=total.toLocaleString();
  const max=results.length>0?results[0].count:1;
  $("#sal_tbody").innerHTML=results.length
    ?results.map((r,i)=>{const pct=total>0?((r.count/total)*100).toFixed(1):"0.0";const bar=((r.count/max)*100).toFixed(1);
      return `<tr><td>${i+1}</td><td>${esc(r.sku)}</td><td style="color:var(--mut);font-size:.78rem">${r.code}</td><td class="right">${r.count.toLocaleString()}</td><td class="right">${pct}%</td><td><div class="bar-bg"><div class="bar-fill" style="width:${bar}%"></div></div></td></tr>`;}).join("")
    :`<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:28px">No dispenses found.</td></tr>`;
  $("#sal_results").style.display="block";
}

async function searchSalesTxns(){
  const s0=$("#sal_s0"),s1=$("#sal_s1"),e0=$("#sal_e0"),e1=$("#sal_e1"),loc=$("#sal_loc");
  if(!s0||!s0.value||!e0||!e0.value){setSalesStatus("Enter a start and end date.","error");return;}
  const start=`${s0.value} ${s1.value}`,end=`${e0.value} ${e1.value}`;
  const btn=$("#sal_btn");btn.disabled=true;
  setSalesStatus("Querying…","loading");
  $("#sal_results").style.display="none";$("#sal_txns").style.display="none";
  try{
    let url=`/api/transactions?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
    if(loc&&loc.value)url+=`&location=${encodeURIComponent(loc.value)}`;
    const d=await(await fetch(url)).json();
    if(d.error){setSalesStatus("Error: "+d.error,"error");return;}
    setSalesStatus("","");renderSalesTxns(d.results,d.capped);
  }catch(e){setSalesStatus("Could not reach the server.","error");}
  finally{btn.disabled=false;}
}

function renderSalesTxns(results,capped){
  const cap=$("#sal_cap"),cnt=$("#sal_cnt");
  if(cap)cap.style.display=capped?"block":"none";
  if(cnt)cnt.textContent=results.length?`${results.length.toLocaleString()} transaction${results.length!==1?"s":""}${capped?" (capped)":""}`:""
  $("#sal_tbodytxn").innerHTML=results.length
    ?results.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${esc(r.item)}</td><td>${esc(r.machine)}</td></tr>`).join("")
    :`<tr><td colspan="4" style="text-align:center;color:var(--mut);padding:28px">No transactions found.</td></tr>`;
  $("#sal_txns").style.display="block";
}

function setSalesStatus(msg,type){
  const el=$("#sal_status");if(!el)return;
  el.style.display=msg?"block":"none";
  el.className="sales-status "+(type||"");
  el.textContent=msg;
}

function exportSalesCSV(view){
  const s0=$("#sal_s0"),e0=$("#sal_e0"),loc=$("#sal_loc");
  const start=s0?s0.value:"",end=e0?e0.value:"";
  const locLabel=loc?loc.options[loc.selectedIndex]?.text||"all":"all";
  const csvEsc=v=>{const s=String(v??"");return(s.includes(",")||s.includes('"')||s.includes("\n"))?`"${s.replace(/"/g,'""')}"`:`${s}`;};
  let rows,filename;
  if(view==="summary"){
    rows=[["#","SKU","Item Code","Count","% of Total"]];
    document.querySelectorAll("#sal_tbody tr").forEach(tr=>{const tds=tr.querySelectorAll("td");
      if(tds.length>=5)rows.push([tds[0].textContent,tds[1].textContent,tds[2].textContent,tds[3].textContent,tds[4].textContent]);});
    filename=`sales_summary_${locLabel}_${start}_to_${end}.csv`;
  }else{
    rows=[["Date","Time","Item Dispensed","Machine"]];
    document.querySelectorAll("#sal_tbodytxn tr").forEach(tr=>{const tds=tr.querySelectorAll("td");
      if(tds.length>=4)rows.push([tds[0].textContent,tds[1].textContent,tds[2].textContent,tds[3].textContent]);});
    filename=`transactions_${locLabel}_${start}_to_${end}.csv`;
  }
  const csv=rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename.replace(/[^a-z0-9._\-]/gi,"_");
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function esc(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

function setBanner(h){const b=$("#banner");live=!!(h&&h.live);

/* boot */
async function boot(){
  state.role = MYROLES.find(r=>ROLE_NAV[r]) || state.role;   // land on the real role's home
  buildRolePicker();state.area=ROLE_HOME[state.role];
  try{
    const res=await fetch("/alpha/api/bootstrap");const d=await res.json();
    machines=(d.machines||[]).map(m=>({vendsSince:null,...m}));
    work=d.work||[];
    state.salesVends=d.health?d.health.salesVends:null;
    if(!machines.length){demoSeed();setBanner({live:false,reason:"no rows returned"});}
    else setBanner(d.health);
  }catch(e){demoSeed();setBanner({live:false,reason:String(e)});}
  try{  // assignment targets — managers only; non-managers just get free-text
    const t=await(await fetch("/api/wo/technicians")).json();
    techs=(t&&t.technicians||[]).map(u=>({email:(u.email||u.mail||u.userPrincipalName||"").toLowerCase(),name:u.name||u.displayName||null})).filter(u=>u.email);
    drivers=techEmails();
  }catch(e){techs=[];drivers=[];}
  render();
}
boot();
